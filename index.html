<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Genesis 0.15 V003 — PlayCanvas</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10181d;color:#eee;font:14px system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}#mobile{display:none;position:fixed;inset:auto 0 12px;pointer-events:none;z-index:50}#mobile button{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;width:58px;height:58px;border-radius:14px;border:1px solid #b7b7a0;background:#14212cdb;color:white;font-size:24px;font-weight:bold}#pad{position:absolute;bottom:0;left:14px;display:grid;grid-template-columns:repeat(3,58px);gap:4px}#pad .up{grid-column:2}#pad .left{grid-column:1;grid-row:2}#pad .down{grid-column:2;grid-row:2}#pad .right{grid-column:3;grid-row:2}@media(pointer:coarse){#mobile{display:block}#controls{bottom:148px;left:10px;right:10px;font-size:11px;pointer-events:none}#ui{max-height:25vh;max-width:70vw;padding:7px}#ui h1{font-size:13px}}#ui{position:absolute;top:12px;left:12px;background:#14212ce8;padding:14px;border:1px solid #5d6d70;border-radius:8px;max-width:390px;max-height:65vh;overflow:auto}#ui h1{font-size:18px;margin:0 0 8px}#rows{font:11px system-ui;white-space:normal;max-height:35vh;overflow:auto}#ui{box-shadow:0 10px 32px #0008;backdrop-filter:blur(10px);width:min(350px,calc(100vw - 36px));box-sizing:border-box}#ui h1{font:600 16px Georgia,serif;color:#e8c990;letter-spacing:.04em}#status{font-size:12px;color:#d8d3c5;margin:8px 0}#progress{height:7px;border-radius:8px;background:#36434a;overflow:hidden}#bar{height:100%;width:0;background:linear-gradient(90deg,#95723a,#e7c78b);transition:width .2s}#summary{display:flex;justify-content:space-between;gap:10px;margin:7px 0;color:#c3d0cb;font-size:11px}#details{margin-top:9px;border-top:1px solid #79694e;padding-top:8px}#details summary{cursor:pointer;color:#e7c78b;font-size:12px}#rows .asset{padding:6px 0;border-bottom:1px solid #ffffff18}#rows .asset-head{display:flex;justify-content:space-between;gap:8px}#rows .asset-name{color:#eee}#rows .asset-state{color:#b6c8bc}#rows .asset.error .asset-state{color:#ff9d8b}#rows .track{height:3px;background:#435058;margin-top:5px;border-radius:3px;overflow:hidden}#rows .fill{height:100%;background:#c3a56b}#rows .meta{color:#aeb7b9;font-size:10px;margin-top:3px}#ui.minimized #details,#ui.minimized #status,#ui.minimized #progress,#ui.minimized #summary{display:none}#toggle{float:right;background:transparent;border:1px solid #8c7c60;color:#d8c19b;border-radius:4px;cursor:pointer}#controls{position:absolute;bottom:12px;left:12px;background:#14212ce8;padding:10px;border-radius:6px}#mobile{right:0}#actions{position:absolute;right:14px;bottom:0;display:grid;grid-template-columns:repeat(2,62px);gap:6px}#actions button{font-size:12px;width:62px;height:54px}#mobile button:active{background:#526a76}#orientation{display:none;position:fixed;right:10px;top:10px;z-index:55;padding:7px;background:#14212cdd;color:white;border:1px solid #8a8a7a;border-radius:6px;font-size:12px}@media(pointer:coarse) and (orientation:portrait){#orientation{display:block}#ui{top:45px;max-height:19vh}#controls{display:none}}@media(pointer:coarse) and (orientation:landscape){#ui{max-height:24vh}#controls{display:none}}@media(pointer:fine){#mobile{display:none}} </style></head><body><canvas id="app"></canvas><section id="ui"><button id="toggle" type="button" aria-label="Minimizar descargas">−</button><h1>Genesis 0.15 V003</h1><div id="status">Preparando mundo...</div><div id="progress"><div id="bar"></div></div><div id="summary"><span id="counts">0 / 0 recursos</span><span id="bytes">0 MB descargados</span></div><details id="details"><summary>Ver descargas individuales</summary><div id="rows"></div></details></section><div id="controls">PC: WASD y arrastrar · Celular: flechas y deslizar sobre el mundo para girar cámara</div><div id="mobile"><div id="pad"><button class="up" data-key="KeyW" aria-label="Adelante">▲</button><button class="left" data-key="KeyA" aria-label="Izquierda">◀</button><button class="down" data-key="KeyS" aria-label="Atrás">▼</button><button class="right" data-key="KeyD" aria-label="Derecha">▶</button></div><div id="actions"><button data-key="ShiftLeft" aria-label="Correr">Correr</button><button id="interact" aria-label="Interactuar">Acción</button><button id="zoom-in" aria-label="Acercar cámara">Zoom +</button><button id="zoom-out" aria-label="Alejar cámara">Zoom −</button><button id="full-screen" aria-label="Pantalla completa">⛶</button></div></div><button id="orientation" type="button">⛶ Pantalla horizontal</button><script src="./tests/v015-v001/v015-diagnostics.js"></script><script src="./assets/vendor/playcanvas/playcanvas.min.js"></script><script type="module">
const diag=window.GenesisV015Diagnostics;diag?.block('runtime.playcanvas','starting');const status=document.getElementById('status'),rows=document.getElementById('rows');const pc=window.pc;if(!pc){status.textContent='FALTA MOTOR LOCAL: assets/vendor/playcanvas/playcanvas.min.js';throw Error('PlayCanvas local engine missing')}
const canvas=document.getElementById('app');const app=new pc.Application(canvas,{graphicsDeviceOptions:{alpha:false,antialias:true}});app.start();app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);window.addEventListener('resize',()=>app.resizeCanvas());
app.scene.ambientLight=new pc.Color(.45,.46,.45);app.scene.exposure=1.2;
const floor=new pc.Entity('Piso 63x63');floor.addComponent('render',{type:'box'});floor.setLocalScale(63,.2,63);floor.setPosition(0,-.1,0);const mat=new pc.StandardMaterial();mat.diffuse=new pc.Color(.72,.72,.72);mat.update();
const texBase='./assets/playcanvas/approved/world/floors/plaza/cobblestone/';
const textureFiles=[['diffuseMap','cobble_color.png'],['normalMap','cobble_normal.png'],['aoMap','cobble_ao.png']];
for(const [property,file] of textureFiles){
  const texture=new pc.Asset('Original PBR '+file,'texture',{url:texBase+file});
  app.assets.add(texture);
  texture.once('load',()=>{mat[property]=texture.resource;mat.update();});
  texture.once('error',err=>console.error('PBR texture failed',file,err));
  app.assets.load(texture);
}
floor.render.material=mat;app.root.addChild(floor);
const sun=new pc.Entity('Sol');sun.addComponent('light',{type:'directional',color:new pc.Color(1,.94,.8),intensity:1.3,castShadows:true});sun.setEulerAngles(45,30,0);app.root.addChild(sun);
const camera=new pc.Entity('Camara');camera.addComponent('camera',{clearColor:new pc.Color(.25,.34,.4),farClip:180});app.root.addChild(camera);
diag?.block('manifest','request');const manifest=await (await fetch('./tests/v015-v001/manifest.json',{cache:'no-store'})).json();diag?.block('manifest','ready',{characters:manifest.characters.length});const people=new Map(),states=new Map();
for(const c of manifest.characters){states.set(c.id,{name:c.name,received:0,total:c.bytes||null,status:'Pendiente'})}
const fmt=x=>x==null?'—':(x/1048576).toFixed(2)+' MB';const bar=document.getElementById('bar'),counts=document.getElementById('counts'),bytes=document.getElementById('bytes');document.getElementById('toggle').addEventListener('click',()=>{const ui=document.getElementById('ui');ui.classList.toggle('minimized');document.getElementById('toggle').textContent=ui.classList.contains('minimized')?'+':'−'});function refresh(){const values=[...states.values()],done=values.filter(x=>x.status==='Listo'||x.status.startsWith('ERROR')).length,errors=values.filter(x=>x.status.startsWith('ERROR')).length,total=values.reduce((n,x)=>n+x.received,0);counts.textContent=done+' / '+values.length+' procesados'+(errors?' · '+errors+' errores':'');bytes.textContent=fmt(total);bar.style.width=(values.length?Math.round(done/values.length*100):0)+'%';rows.replaceChildren();for(const x of values){const el=document.createElement('div');el.className='asset'+(x.status.startsWith('ERROR')?' error':'');const head=document.createElement('div');head.className='asset-head';const name=document.createElement('span');name.className='asset-name';name.textContent=x.name;const state=document.createElement('span');state.className='asset-state';state.textContent=x.status==='Listo'?'✓ Listo':x.status;head.append(name,state);const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=(x.total?Math.min(100,x.received/x.total*100):x.status==='Listo'?100:0)+'%';track.append(fill);const meta=document.createElement('div');meta.className='meta';meta.textContent=fmt(x.received)+(x.total?' / '+fmt(x.total):'');el.append(head,track,meta);rows.append(el)}}
refresh();status.textContent='Suelo 63 × 63 listo · Cargando personajes locales';
for(const c of manifest.characters){const s=states.get(c.id);let controller=new AbortController(),last=Date.now();const watchdog=setInterval(()=>{if(Date.now()-last>120000)controller.abort()},1000);try{const url=new URL(c.file,new URL('./tests/v015-v001/',location.href));if(url.origin!==location.origin)throw Error('Modelo externo bloqueado');s.status='Descargando';diag?.asset(c.id,'request',{url:url.pathname});refresh();const res=await fetch(url,{signal:controller.signal});if(!res.ok)throw Error('HTTP '+res.status);const length=Number(res.headers.get('content-length'));if(length>0)s.total=length;const chunks=[];const reader=res.body.getReader();while(true){const {done,value}=await reader.read();if(done)break;chunks.push(value);s.received+=value.byteLength;last=Date.now();diag?.asset(c.id,'downloading',{loaded:s.received,total:s.total});refresh()}const bytes=new Uint8Array(s.received);let offset=0;for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.byteLength}if(bytes.length<12||String.fromCharCode(...bytes.slice(0,4))!=='glTF'||new DataView(bytes.buffer).getUint32(8,true)!==bytes.length)throw Error('GLB inválido');s.status='Procesando GLB';diag?.asset(c.id,'decoding',{loaded:s.received,total:s.total});refresh();const asset=new pc.Asset(c.name,'container',{url:url.href,filename:c.id+'.glb'},null,{buffer:bytes.buffer});app.assets.add(asset);await new Promise((resolve,reject)=>{asset.once('load',resolve);asset.once('error',reject);app.assets.load(asset)});const entity=asset.resource.instantiateRenderEntity();entity.name=c.name;const pos=c.position||[1.72,0,1.90];if(c.attachTo){const parent=people.get(c.attachTo);if(parent){parent.addChild(entity);entity.setLocalPosition(0,0,0)}else app.root.addChild(entity)}else{entity.setPosition(...pos);app.root.addChild(entity);people.set(c.id,entity)}s.status='Listo';diag?.asset(c.id,'instantiated',{loaded:s.received,total:s.total});refresh()}catch(e){s.status='ERROR '+String(e.message||e);diag?.asset(c.id,'error',{message:String(e.message||e),stack:String(e.stack||'')});refresh()}finally{clearInterval(watchdog)}}
const artisan=people.get('artisan');const keys=new Set();window.addEventListener('keydown',e=>keys.add(e.code));window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());for(const btn of document.querySelectorAll('#pad button')){const code=btn.dataset.key;btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);keys.add(code)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(ev,e=>{e.preventDefault();keys.delete(code)})}let yaw=0,drag=false,px=0,zoom=8;const requestLandscape=async()=>{try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){console.info('Fullscreen unavailable',e)}try{if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch(e){console.info('Landscape lock unavailable on this browser',e)}};document.getElementById('orientation').addEventListener('click',requestLandscape);document.getElementById('full-screen').addEventListener('click',requestLandscape);document.getElementById('interact').addEventListener('click',()=>{diag?.block('input.interact','pressed');status.textContent='Acción recibida · Interacciones del juego pendientes de integración'});for(const [id,delta] of [['zoom-in',-1],['zoom-out',1]])document.getElementById(id).addEventListener('click',()=>{zoom=Math.max(3,Math.min(16,zoom+delta))});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(3,Math.min(16,zoom+Math.sign(e.deltaY)))},{passive:false});canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;canvas.setPointerCapture(e.pointerId)});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-px)*.006;px=e.clientX}});
app.on('update',dt=>{if(artisan){const p=artisan.getPosition().clone(),speed=(keys.has("ShiftLeft")?5.4:3)*dt;let dx=0,dz=0;if(keys.has('KeyW'))dz-=1;if(keys.has('KeyS'))dz+=1;if(keys.has('KeyA'))dx-=1;if(keys.has('KeyD'))dx+=1;const x=dx*Math.cos(yaw)-dz*Math.sin(yaw),z=dx*Math.sin(yaw)+dz*Math.cos(yaw);p.x=Math.max(-31,Math.min(31,p.x+x*speed));p.z=Math.max(-31,Math.min(31,p.z+z*speed));p.y=0;artisan.setPosition(p);camera.setPosition(p.x+Math.sin(yaw)*zoom,p.y+zoom*.75,p.z+Math.cos(yaw)*zoom);camera.lookAt(p.x,p.y+1,p.z)}else{camera.setPosition(8,7,12);camera.lookAt(0,0,0)}});
diag?.block('characters','completed');status.textContent='Carga terminada · Revisar estados de cada personaje';
</script></body></html>
