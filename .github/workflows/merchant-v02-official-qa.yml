name: Ship merchant V02 from approved 75962 GLB - in game QA
on:
  push:
    branches: [feature/merchant-v02-official-20261102]
    paths: [.github/workflows/merchant-v02-official-qa.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merchant-v02:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy exact Meshoptimizer approved asset into PlayCanvas project
        run: |
          set -euxo pipefail
          mkdir -p assets/playcanvas/approved/characters
          curl -fLsS --retry 3 -o assets/playcanvas/approved/characters/mercader-v02-75962.glb \
           https://raw.githubusercontent.com/ProjectgenesisAssets/genesis-workshop-assets/e230d04cc781fd24f375065098788752155a3e52/web-assets/characters/mercader-v02-75962.glb
          test "$(sha256sum assets/playcanvas/approved/characters/mercader-v02-75962.glb | cut -d ' ' -f1)" = "8bd0c2423e55404c401890bf84cb0ec9d7c11b3818b0cbb6aad14e20d5be8bf4"
          python - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path('assets/playcanvas/approved/characters/mercader-v02-75962.glb')
          with p.open('rb') as f:
              m,version,total,n,kind=struct.unpack('<4sIIII',f.read(20))
              assert m==b'glTF' and version==2 and total==p.stat().st_size and kind==0x4e4f534a
              j=json.loads(f.read(n))
          triangles=sum(j['accessors'][prim['indices']]['count']//3 for mesh in j['meshes'] for prim in mesh['primitives'])
          assert triangles==75962 and j.get('textures') and j.get('materials')
          assert 'EXT_meshopt_compression' not in j.get('extensionsRequired',[])
          print('VERIFIED MERCHANT V02',triangles,'triangles, bytes',p.stat().st_size)
          PY
      - name: Integrate only market NPC visual and increment game build version
        run: python scripts/integrate_merchant_v02_official.py
      - name: Validate JavaScript and commerce/quest regression tests
        run: |
          node --check genesis_market_v001.js
          node --check village_world.js
          node --test tests/genesis_market_domain_v001.cjs tests/genesis_market_integration_v001.cjs tests/ordan_market_quest_v014021.cjs tests/starter_sword_stock_v014020.cjs
          git diff --check
      - name: Install browser testing dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render NPC in actual game scene and capture screenshot
        run: node tests/merchant_v02_browser.cjs
      - name: Publish screenshot for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-genesis-merchant-v02-in-game
          path: previews/market-merchant-v022/
          retention-days: 14
          if-no-files-found: warn
      - name: Save validated changes on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html village_world.js genesis_market_v001.js assets/playcanvas/approved/characters/mercader-v02-75962.glb
          git diff --cached --check
          git commit -m "feat: Project Genesis v0.14.022 real merchant V02 in market"
          git push origin HEAD:feature/merchant-v02-official-20261102
