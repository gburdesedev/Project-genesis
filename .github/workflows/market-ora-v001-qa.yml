name: "Genesis Mercado ORA V001 QA"
on:
  push:
    branches: [experiment/mercado-ora-v001-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and market domain
        run: |
          node --check genesis_market_v001.js
          node --check genesis_market_domain_v001.js
          node --test tests/genesis_market_domain_v001.cjs
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture actual market in game
        run: node tests/genesis_market_browser_v001.cjs
      - name: Save result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-mercado-ora-v001-captura
          path: previews/market-v014019-qa/
          retention-days: 7
