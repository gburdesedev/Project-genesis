name: V0187 camera and workshop doors real PlayCanvas QA
on:
  push:
    branches: [experiment/v0187-camera-door-gameplay-fix]
    paths:
      - 'v0187/**'
      - 'tools/v0187_camera_door_qa.cjs'
      - '.github/workflows/v0187-camera-door-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate experimental source, isolated saves and original assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          j=json.loads(pathlib.Path('v0187/manifest.json').read_text())
          assert j['version']=='0.15-v0187'
          assert j['lightingAsset']['format']=='Radiance RGBE HDR 32-bit'
          w={x['id']:x for x in j['workshopAssets']}
          assert 'door-herrero-v082-b' in w and 'portal-arch-v0185' in w
          assert 'forge-station-v038' in w
          print('V0187 manifest, original GLBs and HDRI pinned')
          PY
          node --check v0187/v017-village.js
          node --check v0187/herrero-interior-v0186.js
          node --check tools/v0187_camera_door_qa.cjs
      - name: Install Chromium Playwright with software WebGL
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test PC pointer-lock, mobile camera, animated door, real GLBs, loading
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v0187-http.log 2>&1 &
          node tools/v0187_camera_door_qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0187-original-camera-and-door-PC-mobile
          path: /tmp/genesis-v0187-camera-door/
          retention-days: 14
          if-no-files-found: warn
