name: V014.028 | Audit actual game mercenary entry and crafting
on:
  push:
    branches: [experiment/v014028-mercenary-v09-real-craft-playwright-20261107]
    paths: [.github/workflows/v014028-inspect-game.yml]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Print bounded exact game source excerpts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text('utf-8')
          keys=['function showMercenaryEquipment','function showMercenaryCandidates','function showMercenarySheet','function performExperimentalCraft','function confirmCraft','function performCraft','function generateCraft','function itemVisual','function renderMercInventory','function setTutorialStep','const craftedItems','let craftedItems','const engine=','const session=','let session=','const MERC_CANDIDATES','const poolA','const poolB','window.GenesisMercenaryConcept.open','GenesisMercenaryConcept.open','tutorialStep','function showMercenaryEquipment(']
          print('INDEX LEN',len(s),'LINES',s.count('\\n')+1)
          for k in keys:
            i=s.find(k)
            if i < 0:
              print('MISSING',repr(k));continue
            l=s.count('\\n',0,i)+1
            print('BLOCK',repr(k),'LINE',l,'=>',repr(s[max(0,i-220):min(len(s),i+9200)]))
          PY
