name: Build Genesis per-asset boot diagnostic
on:
  push:
    branches: [fix/boot-per-asset-diagnostics-20261103]
    paths:
      - 'tools/patch_boot_diag.py'
      - 'genesis_asset_diagnostics_v001.js'
      - '.github/workflows/patch-boot-diag.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/patch_boot_diag.py
      - run: node --check genesis_asset_diagnostics_v001.js
      - name: Check game module syntax
        run: |
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text()
          blocks=re.findall(r'<script\b[^>]*type=["\x27]module["\x27][^>]*>(.*?)</script>',s,re.S|re.I)
          print('Module scripts found',len(blocks))
          assert blocks
          for i,block in enumerate(blocks):
           pathlib.Path(f'/tmp/genesis-module-{i}.mjs').write_text(block)
          PY
          for f in /tmp/genesis-module-*.mjs; do node --check "$f"; done
      - name: Commit diagnosed boot code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/genesis_asset_sizes.json
          git diff --cached --quiet || { git commit -m "fix(boot): preload Herrero and expose per-file transfer progress"; git push; }
