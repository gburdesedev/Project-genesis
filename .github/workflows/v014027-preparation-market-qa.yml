name: Genesis V014.027 | Preparacion and Merchant V02 QA
on:
  push:
    branches:
      - release/v014027-preparation-result-20261108
  pull_request:
    paths:
      - preparacion_control.js
      - genesis_ui_approved.js
      - genesis_ui_approved.css
      - genesis_market_v001.js
      - 'tests/approved_ui_four_screens.cjs'
      - 'tests/merchant_v02_in_game.cjs'
      - '.github/workflows/v014027-preparation-market-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check preparacion_control.js
          node --check genesis_ui_approved.js
          node --check tests/approved_ui_four_screens.cjs
      - name: Install Chromium test dependencies
        run: npm install --prefix /tmp/genesis-test playwright@1.56.1
      - name: Run real preparation Chromium checks
        run: NODE_PATH=/tmp/genesis-test/node_modules node tests/approved_ui_four_screens.cjs
      - name: Archive material and result captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-v014027-preparation-evidence
          path: previews/approved-ui-four-screens/
          retention-days: 14
  merchant:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test dependencies
        run: npm install --prefix /tmp/genesis-test playwright@1.56.1
      - name: Check actual Merchant V02 loading in full game
        run: NODE_PATH=/tmp/genesis-test/node_modules node tests/merchant_v02_in_game.cjs
      - name: Archive actual merchant screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-v014027-merchant-evidence
          path: previews/merchant-v02-game/
          retention-days: 14
