name: Legacy V014022 stream UI precision patch
on:
  push:
    branches: [experiment/legacy-v014022-approved-assets-loader-20261105]
    paths:
      - .github/workflows/v014022-stream-ui.yml
      - tools/patch_v014022_stream_ui.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep the archived scene and hand progress exclusively to streamer
        run: python3 tools/patch_v014022_stream_ui.py
      - name: Validate JavaScript and required asset counts
        run: |
          node --check genesis_v014022_stream_loader.js
          node --check device_policy.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'Project Genesis v0.14.022' in s
          assert 'GenesisStreamLoader.trackRoute(prof)' in s
          assert 'window.GenesisStreamLoader.prepare(originalId)' in s
          assert 'data-genesis-boot-asset="peasantMale086"' in s
          assert '#loadGroups{display:none!important}' in s
          modules=[m for m in re.findall(r'<script\b[^>]*type="module"[^>]*>(.*?)</script\s*>',s,re.S|re.I) if len(m)>1000]
          Path('/tmp/legacy-v014022-script.mjs').write_text(modules[-1])
          PY
          node --check /tmp/legacy-v014022-script.mjs
          git diff --check
      - name: Commit experimental UI fix, never touch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'experiment(v014022): show only streamed progress and required route assets'
            git push
          fi
