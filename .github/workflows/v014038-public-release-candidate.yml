name: Genesis V014.038 release candidate | public GitHub Actions
on:
  push:
    branches: ['release-candidate/v014038-public-qa-20261108']
    paths:
      - 'index.html'
      - 'village_world.js'
      - 'genesis_market_cinematic_v001.js'
      - 'tests/v014038_release_contract_20261108.cjs'
      - 'tests/v014038_full_boot_live.cjs'
      - '.github/workflows/v014038-public-release-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of current JS and latest 038 rules
        run: |
          node --check village_world.js
          node --check village_trees.js
          node --check village_fountain_v014034.js
          node --check village_workshops_v014036.js
          node --check genesis_market_cinematic_v001.js
          node --check tests/v014038_release_contract_20261108.cjs
          node tests/v014038_release_contract_20261108.cjs
          node tests/v014037_arrival_contract.cjs
          node tests/v014038_market_cinema_contract.cjs
  actual-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright in public runner
        run: npm install --prefix /tmp/genesis-v038-public playwright@1.56.1
      - name: Real V014038 WebGL boot with Herrero, V016, trees, fountain, merchant and closed workshops
        run: NODE_PATH=/tmp/genesis-v038-public/node_modules node tests/v014038_full_boot_live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-v014038-public-candidate-evidence
          path: previews/v014038-full-boot/
          retention-days: 14
