name: Genesis V014.029 | Recovered original creation result QA
on:
  push:
    branches:
      - release/v014029-historic-crafting-result-20261108
  pull_request:
    paths:
      - index.html
      - tests/v014029_historic_result_qa.cjs
      - .github/workflows/v014029-historic-result-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-sword-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real canonical sword source and current result integration
        run: |
          node --check tests/v014029_historic_result_qa.cjs
          node tests/v014028_approved_sword_result.cjs
      - name: Install Playwright test dependency
        run: npm install --prefix /tmp/genesis-playwright playwright@1.56.1
      - name: Render and verify real Chromium captures of both channel scenarios
        run: NODE_PATH=/tmp/genesis-playwright/node_modules node tests/v014029_historic_result_qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-v014029-historic-creation-screen-evidence
          path: previews/v014029-historic-result/
          retention-days: 14
