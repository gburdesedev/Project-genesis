name: Genesis V014.035 | approved V02 merchant and actual PlayCanvas market
on:
  push:
    branches: ['experiment/v014035-mercader-v02-20261108']
    paths:
      - 'genesis_market_v001.js'
      - '.github/workflows/v014035-merchant-v02-qa.yml'
      - 'tests/merchant_v02_in_game.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merchant-v02:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate merchant runtime
        run: |
          node --check genesis_market_v001.js
          node --check tests/merchant_v02_in_game.cjs
          node tests/genesis_market_domain_v001.cjs
      - name: Install browser test runner
        run: npm install --prefix /tmp/genesis-v035 playwright@1.56.1
      - name: Real approved V02 merchant GLB and PlayCanvas NPC
        run: NODE_PATH=/tmp/genesis-v035/node_modules node tests/merchant_v02_in_game.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-v014035-merchant-v02-evidence
          path: previews/merchant-v02-game/
          retention-days: 14
