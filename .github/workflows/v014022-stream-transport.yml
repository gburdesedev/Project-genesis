name: Legacy V014022 streamed loader - isolated experiment
on:
  push:
    branches: [experiment/legacy-v014022-approved-assets-loader-20261105]
    paths:
      - tools/patch_v014022_stream_transport.py
      - .github/workflows/v014022-stream-transport.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch original 0.14.022 loading pathway in isolated branch
        run: python3 tools/patch_v014022_stream_transport.py
      - name: Verify JS and no longer eager-loading the boot models
        run: |
          node --check genesis_v014022_stream_loader.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'Project Genesis v0.14.022' in s
          assert '#loadGroups{display:none!important}' in s
          assert 'window.GenesisStreamLoader.setApp(appEl.app)' in s
          assert 'window.GenesisStreamLoader.prepare(originalId)' in s
          assert 'window.GenesisStreamLoader.prepare(primary' in s
          assert 'data-genesis-boot-asset="peasantMale086"' in s
          assert 'data-genesis-boot-asset="ual1086"' in s
          assert 'const guard=sleep(6500)' not in s
          assert 'routeReady.add(prof)' in s
          assert re.search(r'<pc-asset[^>]*id="peasantMale086"[^>]*\blazy>',s)
          assert not re.search(r'<pc-model[^>]*id="playerModel"[^>]*\sasset=',s)
          modules=[m for m in re.findall(r'<script\b[^>]*type="module"[^>]*>(.*?)</script\s*>',s,re.S|re.I) if len(m)>1000]
          assert modules
          Path('/tmp/legacy-v014022-stream-script.mjs').write_text(modules[-1])
          PY
          node --check /tmp/legacy-v014022-stream-script.mjs
          git diff --check
      - name: Commit experimental changes without main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'experiment(v014022): route legacy asset downloads through queued streamer and per-file UI'
            git push
          fi
