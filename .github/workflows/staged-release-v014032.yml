name: Genesis | versioned staged candidate v0.14.032
on:
  push:
    branches: ['integration/stable-patches-20261108']
    paths:
      - '.github/workflows/staged-release-v014032.yml'
      - 'scripts/bump_stable_release_v014032.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump-candidate-only:
    if: github.ref == 'refs/heads/integration/stable-patches-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verified bounded version and cache bump
        run: |
          python3 scripts/bump_stable_release_v014032.py
          git diff --check
          git diff --stat
      - name: Persist ONLY to the candidate branch
        run: |
          if git diff --quiet -- index.html preparacion_control.js; then
            echo "No changes required"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html preparacion_control.js
          git commit -m "release(candidate): v0.14.032 build 20261108.01, aligned HUD and approved UI cache"
          git push origin HEAD:integration/stable-patches-20261108
