name: V018.5 PlayCanvas QA | five natural-ratio doors plus Blender arches
on:
  push:
    branches: [experiment/v0185-authentic-door-arches]
    paths:
      - 'tools/v0185_arched_playwright_qa.cjs'
      - '.github/workflows/v0185-arched-playwright-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-arches:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, landscape, portrait]
    env:
      GENESIS_AUDIT_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable masters, new Blender candidate, HDRI and scene JS
        run: |
          node --check v0185/v017-village.js
          node --check tools/v0185_arched_playwright_qa.cjs
          test -s assets/playcanvas/candidates/workshops/portals/v0185/portal_arch_v0185.glb
          test -s assets/playcanvas/approved/lighting/studio_small_09/studio_small_09_2k.hdr
          node -e "const m=require('./v0185/manifest.json');if(m.version!=='0.15-v0185'||m.workshopAssets?.length!==7)process.exit(1)"
      - name: Install Playwright Chromium with actual WebGL
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check all five arches, original door aspect, animation/mat isolation and capture views
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v0185-server.log 2>&1 &
          node tools/v0185_arched_playwright_qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0185-original-ratio-5-arches-${{ matrix.mode }}
          path: /tmp/genesis-v0185-all-doors/${{ matrix.mode }}/
          retention-days: 14
          if-no-files-found: warn
