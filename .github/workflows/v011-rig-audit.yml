name: V011 rig and animation audit
on:
  push:
    paths:
      - '.github/workflows/v011-rig-audit.yml'
      - 'v015/index.html'
      - 'v015/manifest.json'
  workflow_dispatch:
jobs:
  rigs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original GLB skeletons and UAL1 tracks
        run: |
          python3 - <<'PY'
          import json,struct,pathlib
          base=pathlib.Path('v015/assets/playcanvas/approved/characters')
          files={
            'artisan':base/'recovered/male_peasant.glb',
            'head':base/'parts/male_head.glb',
            'hair':base/'parts/hair_simpleparted.glb',
            'mercenary':base/'recovered/male_ranger.glb',
            'merc-head':base/'parts/male_head.glb',
            'merc-hair':base/'parts/hair_buzzed.glb',
            'UAL1':pathlib.Path('assets/playcanvas/approved/animations/UAL1.glb'),
          }
          all_data={}
          for label,path in files.items():
            data=path.read_bytes()
            assert data[:4]==b'glTF',f'Invalid GLB: {path}'
            size,ctype=struct.unpack_from('<II',data,12)
            assert ctype==0x4E4F534A
            g=json.loads(data[20:20+size])
            all_data[label]=g
            nodes=g.get('nodes',[])
            skins=g.get('skins',[])
            anims=g.get('animations',[])
            print(f'=== {label}: {len(data)} bytes nodes={len(nodes)} skins={len(skins)} meshes={len(g.get("meshes",[]))} animations={len(anims)} ===')
            for i,scene in enumerate(g.get('scenes',[])):
              print('SCENE',i,[(j,nodes[j].get('name'),nodes[j].get('translation'),nodes[j].get('rotation'),nodes[j].get('scale')) for j in scene.get('nodes',[])])
            for i,sk in enumerate(skins):
              print('SKIN',i,'joints',len(sk['joints']),'skeleton',nodes[sk['skeleton']].get('name') if sk.get('skeleton') is not None else None,'first',[(nodes[j].get('name'),nodes[j].get('translation')) for j in sk['joints'][:12]])
            print('SKINNED NODES',[(n.get('name'),n.get('skin'),n.get('mesh')) for n in nodes if 'skin' in n][:8])
            print('ROOT NODES',[(i,n.get('name'),n.get('translation')) for i,n in enumerate(nodes) if not any(i in x.get('children',[]) for x in nodes)][:10])
            print('ANIM NAMES',[(x.get('name'),len(x.get('channels',[]))) for x in anims[:80]])
            if label=='UAL1':
              for anim in anims:
                if anim.get('name') in ('Idle_Loop','Walk_Loop','Sprint_Loop'):
                  targets=sorted({nodes[ch['target']['node']].get('name') for ch in anim.get('channels',[]) if ch.get('target',{}).get('node') is not None})
                  print('TRACK TARGETS',anim.get('name'),len(targets),targets[:40])
          ual=all_data['UAL1']
          for l in ['artisan','head','hair','mercenary','merc-hair']:
            names={n.get('name') for n in all_data[l].get('nodes',[])}
            for anim in ual.get('animations',[]):
              if anim.get('name')=='Idle_Loop':
                targets={ual['nodes'][ch['target']['node']].get('name') for ch in anim.get('channels',[]) if ch.get('target',{}).get('node') is not None}
                print('RIG COMPATIBILITY',l,len(targets&names),'/',len(targets),'matched',sorted(targets&names)[:15])
          PY
