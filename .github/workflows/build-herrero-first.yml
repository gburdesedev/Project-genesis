name: Build Herrero-first selective boot
on:
  push:
    branches: [fix/herrero-only-boot-20261103]
    paths: ['tools/build_herrero_first.py','.github/workflows/build-herrero-first.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - run: python tools/build_herrero_first.py
      - run: |
          node --check village_world.js
          node --check genesis_workshop_live_v015.js
          python - <<'PY'
          from pathlib import Path
          s=Path('village_world.js').read_text()
          assert 'onRootReady(root);' in s
          assert "mode:'herrero-first'" in s
          assert "buildings.set('Herrero',building)" in s
          s=Path('index.html').read_text()
          assert "prof!=='Herrero'" in s
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html village_world.js genesis_workshop_live_v015.js
          git diff --cached --quiet || { git commit -m "feat: load Herrero workshop and NPCs before optional world"; git push; }
