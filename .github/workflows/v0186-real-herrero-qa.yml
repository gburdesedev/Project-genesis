name: V0186 Q1 real Herrero forge | WebGL PC/mobile + screenshots
on:
  push:
    branches: [experiment/v0186-herrero-functional-interior]
    paths:
      - 'v0186/**'
      - 'tools/v0186_real_herrero_qa.cjs'
      - '.github/workflows/v0186-real-herrero-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-playcanvas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V0186 baseline, original 32-bit HDRI and GLB bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('v0186/manifest.json').read_text())
          assert x['version']=='0.15-v0186'
          f=[a for a in x['workshopAssets'] if a['id']=='forge-station-v038'][0]
          p=(pathlib.Path('v0186')/f['file']).resolve()
          assert p.is_file() and p.stat().st_size==19220220, str(p)
          assert x['lightingAsset']['format']=='Radiance RGBE HDR 32-bit'
          print('V0186 pinned Forge source and HDRI verified.')
          PY
          node --check v0186/herrero-interior-v0186.js
          node --check v0186/v017-village.js
          node --check tools/v0186_real_herrero_qa.cjs
      - name: Install real Chromium WebGL backend
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Load original playable Q1 and compare forge fire off/on in two real browsers
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v0186-local-server.log 2>&1 &
          node tools/v0186_real_herrero_qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0186-real-forge-Q1-PC-mobile-off-on
          path: /tmp/genesis-v0186-real-forge/
          retention-days: 14
          if-no-files-found: warn
