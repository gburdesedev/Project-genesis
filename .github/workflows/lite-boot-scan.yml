name: Scan lite Genesis boot
on:
  push:
    branches: [fix/lite-boot-recovery-20261103]
    paths: ['tools/scan_lite_boot.py', '.github/workflows/lite-boot-scan.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - run: python tools/scan_lite_boot.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lite_boot_markup_scan.txt
          git diff --cached --quiet || { git commit -m "diagnostic: capture loading markup"; git push; }
