name: Promote V014023 stable asset URLs and version
on:
  push:
    branches: ['experiment/v014022-restore-assets-playwright-20261108']
    paths: ['.github/workflows/promote-v014023-urls.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/v014022-restore-assets-playwright-20261108
          persist-credentials: true
      - name: Pin URLs to approved public asset repository main and update version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='https://raw.githubusercontent.com/ProjectgenesisAssets/genesis-workshop-assets/experiment/v014022-externalize-embedded-20261108/integration/v014022/embedded/'
          new='https://raw.githubusercontent.com/ProjectgenesisAssets/genesis-workshop-assets/main/integration/v014022/embedded/'
          count=s.count(old)
          assert count==17,f'Expected 17 original remote GLBs, found {count}'
          s=s.replace(old,new)
          assert 'Project Genesis v0.14.022' in s,'Known display version changed, refusing patch'
          s=s.replace('Project Genesis v0.14.022','Project Genesis v0.14.023')
          p.write_text(s)
          t=Path('tests/v014022_restored_main_qa.cjs')
          q=t.read_text()
          assert 'experiment/v014022-externalize-embedded-20261108/integration/v014022/embedded/' in q
          q=q.replace('experiment/v014022-externalize-embedded-20261108/integration/v014022/embedded/','main/integration/v014022/embedded/')
          t.write_text(q)
          print('V014023_READY',count,'stable original GLB URLs on organization main')
          PY
      - name: Commit changes to experimental candidate for PR
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/v014022_restored_main_qa.cjs
          git commit -m 'release(v014023): stable organization asset URLs and preserved original gameplay'
          git push origin HEAD:experiment/v014022-restore-assets-playwright-20261108
