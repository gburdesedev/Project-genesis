name: Import recovered character GLBs
on:
  push:
    paths:
      - .github/workflows/import-recovered-characters.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate original GLBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/playcanvas/approved/characters/recovered
          python3 - <<'PY'
          import urllib.request,struct,pathlib,json
          base='https://raw.githubusercontent.com/Genesara/genesara-web/main/public/models/characters/'
          out=pathlib.Path('assets/playcanvas/approved/characters/recovered')
          for name in ('male_peasant.glb','male_ranger.glb'):
              p=out/name
              if not p.exists():
                  req=urllib.request.Request(base+name,headers={'User-Agent':'ProjectGenesis-AssetRecovery/1.0'})
                  with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                  if len(data)<20 or data[:4]!=b'glTF' or struct.unpack_from('<I',data,8)[0]!=len(data):
                      raise ValueError(f'Invalid GLB: {name}')
                  p.write_bytes(data)
              data=p.read_bytes()
              if data[:4]!=b'glTF' or struct.unpack_from('<I',data,8)[0]!=len(data): raise ValueError(name)
              print(name,len(data))
          PY
          cp /dev/null /tmp/placeholder
          cat > assets/playcanvas/approved/characters/recovered/PROVENANCE.md <<'EOF'
          # Recovered character candidates — NOT visually approved
          
          - male_peasant.glb — provisional player artisan; source: https://github.com/Genesara/genesara-web/blob/main/public/models/characters/male_peasant.glb
          - male_ranger.glb — provisional mercenary; source: https://github.com/Genesara/genesara-web/blob/main/public/models/characters/male_ranger.glb
          - Original source repository: https://github.com/Genesara/genesara-web
          - Source repository LICENSE: MIT, copyright (c) 2026 Genesara; see LICENSE.GENESARA.txt.
          - These are recovered candidates, not Project Genesis visual approvals. Verify rigging, animations and equipment sockets.
          - Merchant V02 is already stored at ../merchant_v02_75962.glb. Do not replace it.
          - Ordan uses ordanModel and ordanHairModel in the historic scene; source models still to be recovered.
          EOF
          python3 - <<'PY'
          import urllib.request,pathlib
          url='https://raw.githubusercontent.com/Genesara/genesara-web/main/LICENSE'
          pathlib.Path('assets/playcanvas/approved/characters/recovered/LICENSE.GENESARA.txt').write_bytes(urllib.request.urlopen(url,timeout=30).read())
          PY
      - name: Commit recovered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/playcanvas/approved/characters/recovered
          git diff --cached --quiet || { git commit -m "assets: archive recovered Genesara character GLBs"; git push; }
