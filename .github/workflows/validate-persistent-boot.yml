name: Validate persistent boot diagnosis and sequential route
on:
  push:
    branches: [fix/persist-boot-crash-diagnostics-20261103]
    paths:
      - 'tools/patch_sequential_route.py'
      - 'genesis_asset_diagnostics_v001.js'
      - '.github/workflows/validate-persistent-boot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/patch_sequential_route.py
      - run: node --check genesis_asset_diagnostics_v001.js
      - name: Validate module JavaScript
        run: |
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text()
          blocks=re.findall(r'<script\b[^>]*type=["\x27]module["\x27][^>]*>(.*?)</script>',s,re.S|re.I)
          assert blocks
          for i,b in enumerate(blocks):pathlib.Path(f'/tmp/genesis-{i}.mjs').write_text(b)
          PY
          for f in /tmp/genesis-*.mjs; do node --check "$f"; done
      - name: Save validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || { git commit -m "fix(ios): serialize model instantiation and annotate route progress"; git push; }
