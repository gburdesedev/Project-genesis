name: "Experimental Herrero direct fabrication visual test"
on:
  push:
    branches: [experiment/herrero-fabricacion-directa-v01-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/fabricacion_directa_experimental.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herrero-fabricacion-directa-capturas
          path: artifacts/fabricacion-directa/
