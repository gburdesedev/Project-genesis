name: Genesis V016.001 | Resultado de Creaciones experimental
on:
  push:
    branches:
      - integration/v016001-resultado-creaciones-20261109
    paths:
      - index.html
      - genesis_result_dynamic_v001.js
      - genesis_result_dynamic_v001.css
      - 'tests/resultado_dinamico_*.cjs'
      - '.github/workflows/v016001-resultado-creaciones-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resultado-creaciones:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JS y 24 resultados reales del motor NGE
        run: |
          node --check genesis_result_dynamic_v001.js
          node --check tests/resultado_dinamico_v4.cjs
          node --check tests/resultado_dinamico_browser_v4.cjs
          node tests/resultado_dinamico_v4.cjs
      - name: Instalar Playwright
        run: npm install --prefix /tmp/genesis-v016001 playwright@1.56.1
      - name: Capturas en Chromium
        run: NODE_PATH=/tmp/genesis-v016001/node_modules node tests/resultado_dinamico_browser_v4.cjs
      - name: Evidencia
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-v016001-resultado-creaciones-evidencia
          path: previews/resultado-dinamico-v4/
          retention-days: 14
