name: V018 architecture visual QA — actual WebGL facade renders
on:
  push:
    branches: [experiment/v018-workshop-positions-lossless-door]
    paths:
      - tools/v018_visual_qa.cjs
      - .github/workflows/v018-visual-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-facade-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm V018 exists and pinned approved sources were not overwritten
        run: |
          test -s v018/manifest.json
          test -s assets/playcanvas/candidates/workshops/herrero/doors/v082-b-lossless-v018/door-herrero-v082-b-lossless-webp.glb
          node --check tools/v018_visual_qa.cjs
          node -e "const m=require('./v018/manifest.json');if(m.version!=='0.15-v018')process.exit(1)"
      - name: Start Chromium with WebGL
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture unobstructed Herrero/Arcanista views from fixed camera coordinates
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v018-visual-server.log 2>&1 &
          node tools/v018_visual_qa.cjs
      - name: Upload actual browser architecture views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v018-architecture-unobstructed-pc-mobile
          path: /tmp/v018-architecture-visual/
          retention-days: 14
          if-no-files-found: warn
