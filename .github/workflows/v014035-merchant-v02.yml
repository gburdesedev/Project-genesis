name: Genesis V014035 | merchant V02 mounted in live WebGL game
on:
  push:
    branches: ['experiment/v014035-mercader-v02-carga-inteligente-20261108']
    paths: ['genesis_market_v001.js','village_world.js','index.html','tests/merchant_v02_in_game.cjs','.github/workflows/v014035-merchant-v02.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merchant-visual-and-trade:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax merchant and retained original market economy
        run: |
          node --check genesis_market_v001.js
          node tests/genesis_market_domain_v001.cjs
          test -s assets/playcanvas/approved/characters/merchant_v02_75962.glb
      - name: Install real Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real GLB V02 import, position and visible mesh in market
        run: node tests/merchant_v02_in_game.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-v014035-market-merchant
          path: previews/merchant-v02-game/
          retention-days: 14
