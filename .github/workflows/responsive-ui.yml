name: Responsive game UI
on:
  push:
    branches: [main, 'fix/responsive-game', 'fix/mouse-capture', 'feat/fps-counter', 'fix/mobile-v0.11.001', 'fix/layout-v0.11.002', 'fix/quantity-v0.11.003', 'feat/world-v0.11.004', 'feat/proportions-v0.11.005', 'feat/mineral-v0.11.006', 'feat/functional-menus']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/workshop_geometry.cjs
      - run: node tests/village_plan.cjs
      - run: node tests/fps_counter.cjs
      - run: node tests/camera_mouse.cjs
      - run: npm install --prefix /tmp/responsive-ui playwright@1.56.1 playcanvas@2.22.1
      - run: NODE_PATH=/tmp/responsive-ui/node_modules node tests/responsive.cjs
      - run: NODE_PATH=/tmp/responsive-ui/node_modules node tests/camera_mouse_browser.cjs
      - run: NODE_PATH=/tmp/responsive-ui/node_modules node tests/mobile_menu.cjs
      - run: NODE_PATH=/tmp/responsive-ui/node_modules node tests/mobile_pbr_budget.cjs
      - run: NODE_PATH=/tmp/responsive-ui/node_modules node tests/original_layout.cjs
      - run: NODE_PATH=/tmp/responsive-ui/node_modules node tests/functional_menus.cjs
      - run: NODE_PATH=/tmp/responsive-ui/node_modules node tests/approved_mineral.cjs
      - run: NODE_PATH=/tmp/responsive-ui/node_modules node tests/village_render.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: /tmp/genesis-responsive
          retention-days: 3
