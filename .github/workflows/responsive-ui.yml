name: Responsive game UI
on:
  push:
    branches: [main, 'fix/responsive-game', 'fix/mouse-capture', 'feat/fps-counter', 'fix/mobile-v0.11.001', 'fix/layout-v0.11.002']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/fps_counter.cjs
      - run: node tests/camera_mouse.cjs
      - run: npm install --prefix /tmp/responsive-ui playwright@1.56.1
      - run: /tmp/responsive-ui/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: NODE_PATH=/tmp/responsive-ui/node_modules node tests/responsive.cjs
      - run: NODE_PATH=/tmp/responsive-ui/node_modules node tests/camera_mouse_browser.cjs
      - run: NODE_PATH=/tmp/responsive-ui/node_modules node tests/mobile_menu.cjs
      - run: NODE_PATH=/tmp/responsive-ui/node_modules node tests/original_layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: /tmp/genesis-responsive
          retention-days: 3
