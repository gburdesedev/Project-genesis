name: Genesis V014.036 | four closed workshops + Arcanista V006/V027
on:
  push:
    branches: ['experiment/v014036-talleres-arcanista-20261108']
    paths:
      - 'village_world.js'
      - 'village_workshops_v014036.js'
      - 'tests/v014036_workshops_live.cjs'
      - '.github/workflows/v014036-workshops-live-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workshops:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate runtime
        run: |
          node --check village_world.js
          node --check village_workshops_v014036.js
          node --check tests/v014036_workshops_live.cjs
      - name: Install browser automation
        run: npm install --prefix /tmp/genesis-v036 playwright@1.56.1
      - name: Real game five workshops Arcanista approved assets
        run: NODE_PATH=/tmp/genesis-v036/node_modules node tests/v014036_workshops_live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-v014036-real-workshops
          path: previews/v014036-workshops/
          retention-days: 14
