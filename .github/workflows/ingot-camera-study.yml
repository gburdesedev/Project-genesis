name: Genesis ingot V175 camera study v0.1.009
on:
  push:
    branches: ['review/ingot-camera-study-20261025']
permissions:
  contents: read
jobs:
  camera-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/ingot-camera-test playwright@1.56.1
      - run: /tmp/ingot-camera-test/node_modules/.bin/playwright install chromium
      - name: Verify camera with live GLB and capture 3D frames
        run: NODE_PATH=/tmp/ingot-camera-test/node_modules node tests/ingot_camera_study.cjs
      - name: Assemble comparison sheet and real-GLB animation
        if: success()
        run: |
          ffmpeg -y -pattern_type glob -i '/tmp/genesis-ingot-camera/camera_*.png' -vf 'scale=440:-1:flags=lanczos,tile=3x3' -frames:v 1 /tmp/genesis-ingot-camera/camera_contact_sheet.png
          ffmpeg -y -framerate 16 -i /tmp/genesis-ingot-camera/frames/frame_%03d.png -vf 'fps=16,scale=700:-1:flags=lanczos' /tmp/genesis-ingot-camera/ingot_hover_real_glb.gif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingot-v175-camera-proof-v0.1.009
          path: /tmp/genesis-ingot-camera
          retention-days: 7
