name: Genesis portal boot gate
on:
  pull_request:
    paths:
      - 'village_arcanist.js'
      - 'village_world.js'
      - 'tests/portal_boot_gate.cjs'
      - '.github/workflows/portal-boot-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/portal_boot_gate.cjs
