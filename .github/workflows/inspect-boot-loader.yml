name: Inspect Genesis boot loader
on:
  push:
    branches: [fix/boot-per-asset-diagnostics-20261103]
    paths:
      - 'tools/inspect_boot_source.py'
      - '.github/workflows/inspect-boot-loader.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/inspect_boot_source.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/boot_inspection_excerpts.txt tools/boot_source_*.txt
          git diff --cached --quiet || { git commit -m "diagnostic: record boot loader excerpts"; git push; }
