name: "Genesis / Real PlayCanvas V038 and fountain HQ preview QA"
on:
  push:
    branches: [main]
    paths:
      - scripts/build_genesis_v038_fountain_hq_preview.py
      - previews/genesis-v038-fuente-hq-runtime.js
      - tests/genesis_v038_fountain_hq_browser.cjs
      - .github/workflows/genesis-v038-fuente-hq-preview.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: genesis-v038-fuente-hq-preview
  cancel-in-progress: false
jobs:
  validate-generate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check game-preview build and both JS controllers
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_genesis_v038_fountain_hq_preview.py
          node --check previews/genesis-v038-fuente-hq-runtime.js
          node --check tests/genesis_v038_fountain_hq_browser.cjs
      - name: Generate separate playable game with Draco preboot and real asset anchors
        run: |
          set -euo pipefail
          python3 scripts/build_genesis_v038_fountain_hq_preview.py
          test -s genesis-v038-fuente-hq-preview.html
      - name: Verify BOTH remote binaries, GLB headers, V011 8s animation and V038 coal materials
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,struct,urllib.request,pathlib
          report=json.loads(pathlib.Path('reports/genesis-v038-fuente-hq-preview.json').read_text())
          results={}
          for kind,key in [('fountain','fountain_url'),('forge','forge_url')]:
            try:
              url=report[key]
              req=urllib.request.Request(url,headers={'User-Agent':'ProjectGenesisPlayCanvas-AssetSmoke/1.0'})
              with urllib.request.urlopen(req,timeout=100) as response: data=response.read()
              assert data[:4]==b'glTF',kind+' invalid magic'
              assert struct.unpack_from('<I',data,4)[0]==2,kind+' invalid version'
              assert struct.unpack_from('<I',data,8)[0]==len(data),kind+' invalid GLB file header'
              sz,typ=struct.unpack_from('<I4s',data,12)
              assert typ==b'JSON'
              doc=json.loads(data[20:20+sz])
              meshes=len(doc.get('meshes',[]))
              assert meshes>10,(kind,meshes)
              names=[m.get('name','') for m in doc.get('materials',[])]
              if kind=='fountain':
                clips=doc.get('animations',[])
                assert len(clips)==1,'V011 requires exactly one merged 8s clip'
                assert len(clips[0].get('channels',[]))==91,'V011 lost animation channels'
                assert 'KHR_draco_mesh_compression' in doc.get('extensionsRequired',[]),'HQ compression absent'
              else:
                assert any('charcoal' in name or 'ember' in name for name in names),'V038 hot-coal materials missing'
              results[kind]={'status':'BINARY_VALIDATED','sizeBytes':len(data),'meshes':meshes,'materials':len(names),'animations':len(doc.get('animations',[]))}
            except Exception as error:
              results[kind]={'status':'FAILED','reason':str(error)}
          directory=pathlib.Path('reports/v038-fuente-hq-browser')
          directory.mkdir(parents=True,exist_ok=True)
          (directory/'preflight.json').write_text(json.dumps(results,indent=2))
          print('PREFLIGHT',json.dumps(results))
          assert all(item['status']=='BINARY_VALIDATED' for item in results.values())
          PY
      - name: Install Playwright with WebGL browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render actual game and assert visible V038 + V011 HQ models
        run: node tests/genesis_v038_fountain_hq_browser.cjs
      - name: Upload game / screenshot / QA for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-v038-fuente-hq-actual-browser-${{ github.run_id }}
          path: |
            genesis-v038-fuente-hq-preview.html
            reports/genesis-v038-fuente-hq-preview.json
            reports/v038-fuente-hq-browser/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish separate preview and real-browser QA report (never index.html)
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --ignore-unmatch genesis-v038-fuente-hq-preview.html \
            reports/genesis-v038-fuente-hq-preview.json reports/v038-fuente-hq-browser/
          if ! git diff --cached --quiet; then
            git commit -m "Publish isolated V038+V011 HQ actual PlayCanvas preview and QA [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
