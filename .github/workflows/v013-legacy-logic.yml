name: V013 original Canvas Q1-Q3 logic
on:
  push:
    branches: [main, feat/v013-legacy-canvas-logic]
    paths:
      - '.github/workflows/v013-legacy-logic.yml'
      - 'tests/canvas_legacy_v013.cjs'
      - 'v015/canvas-legacy-logic.js'
      - 'v015/canvas-legacy-nge.js'
      - 'v015/canvas-legacy-preparacion.js'
      - 'v015/canvas-legacy-inventario.js'
      - 'v015/canvas-legacy-ui.js'
  pull_request:
    paths:
      - 'v015/**'
      - 'tests/canvas_legacy_v013.cjs'
  workflow_dispatch:
jobs:
  original-canvas-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original Canvas NGE, workshop tutorial and inventory semantics
        run: node tests/canvas_legacy_v013.cjs
