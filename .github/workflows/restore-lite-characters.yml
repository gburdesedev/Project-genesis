name: Restore playable lite characters
on:
  push:
    branches: [fix/lite-playable-characters-20261103]
    paths: ['tools/restore_lite_characters.py','.github/workflows/restore-lite-characters.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - run: python tools/restore_lite_characters.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'data-disabled-asset=' not in '\n'.join(x for x in s.splitlines() if '<pc-anim-clip' in x)
          assert 'const clipEls=window.GenesisDevice?.safePreviews?[]:' in s
          blocks=re.findall(r'<script\b[^>]*type=["\x27]module["\x27][^>]*>(.*?)</script>',s,re.I|re.S)
          for i,b in enumerate(blocks):Path(f'/tmp/genesis-{i}.mjs').write_text(b)
          assert blocks
          PY
          for f in /tmp/genesis-*.mjs; do node --check "$f"; done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || { git commit -m "fix: restore player and NPC animations in lite mode"; git push; }
