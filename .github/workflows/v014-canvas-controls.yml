name: V014 approved Canvas control geometry
on:
  push:
    branches: [main, feat/v014-original-canvas-controls]
    paths:
      - '.github/workflows/v014-canvas-controls.yml'
      - 'tests/canvas_hud_v014.cjs'
      - 'v015/index.html'
      - 'v015/canvas-original-hud-v014.css'
      - 'v015/canvas-legacy-ui.js'
  pull_request:
    paths:
      - '.github/workflows/v014-canvas-controls.yml'
      - 'tests/canvas_hud_v014.cjs'
      - 'v015/index.html'
      - 'v015/canvas-original-hud-v014.css'
      - 'v015/canvas-legacy-ui.js'
  workflow_dispatch:
jobs:
  original-hud-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare original Canvas CSS declarations, HTML structure and event hooks
        run: node tests/canvas_hud_v014.cjs
