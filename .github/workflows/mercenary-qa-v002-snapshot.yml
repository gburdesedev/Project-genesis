name: Mercenary QA V002 · Visual snapshot only
on:
  push:
    branches: ['feature/mercenary-equipment-runtime-v001']
    paths:
      - 'tests/mercenary_qa_real_engine_snapshot.cjs'
      - '.github/workflows/mercenary-qa-v002-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix /tmp/mercenary-snapshot playwright@1.56.1
          /tmp/mercenary-snapshot/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/mercenary-snapshot/node_modules node tests/mercenary_qa_real_engine_snapshot.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercenary-actual-engine-visual
          path: /tmp/mercenary-qa-v002/concept-*.png
          retention-days: 7
