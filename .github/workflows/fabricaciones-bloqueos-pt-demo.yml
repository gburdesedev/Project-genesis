name: "Fabricaciones demo locks and PT restrictions"
on:
  push:
    branches: [experiment/fabricaciones-bloqueos-pt-demo-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restrictions:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test lock states and demo PT limitations
        run: node tests/fabricaciones_bloqueos_pt_demo.cjs
      - name: Install screenshot browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Preview actual Fabricaciones controller with locked families
        run: node tests/fabricaciones_bloqueos_visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabricaciones-bloqueos-captura
          path: artifacts/fabricaciones-bloqueos/
