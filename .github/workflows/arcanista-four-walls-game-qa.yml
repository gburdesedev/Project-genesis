name: Project Genesis - Herrero and Arcanista full workshop WebGL QA
on:
  push:
    branches: [main]
    paths:
      - index.html
      - genesis_arcanista_four_walls_v006.js
      - genesis_workshop_live_v015.js
      - tests/arcanista_v006_game_browser.cjs
      - .github/workflows/arcanista-four-walls-game-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-two-workshops:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check genesis_arcanista_four_walls_v006.js
          node --check genesis_workshop_live_v015.js
          node --check tests/arcanista_v006_game_browser.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1 playcanvas@2.23.0
          npx playwright install --with-deps chromium
      - name: Verify Arcanista four walls and unmodified magical door, Herrero full masonry
        run: node tests/arcanista_v006_game_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-two-full-workshops-v006-browser
          path: previews/arcanista-v006-game-qa/
          retention-days: 5
