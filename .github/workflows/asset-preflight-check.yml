name: Genesis asset preflight
on:
  pull_request:
    paths:
      - 'genesis_asset_preflight_v001.js'
      - 'index.html'
      - 'preparacion_control.js'
      - 'mercenary_equipment_canvas_v001.js'
      - 'tests/asset_preflight_v001.cjs'
      - '.github/workflows/asset-preflight-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asset-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/asset_preflight_v001.cjs
