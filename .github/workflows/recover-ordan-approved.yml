name: Recover Ordan original model references
on:
  push:
    paths:
      - .github/workflows/recover-ordan-approved.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect historical Canvas and recover Ordan assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,base64,urllib.parse,urllib.request,pathlib,json,struct,shutil
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          target=pathlib.Path('assets/playcanvas/approved/characters/ordan')
          target.mkdir(parents=True,exist_ok=True)
          asset_tags={m.group(1):m.group(0) for m in re.finditer(r'<pc-asset\b[^>]*\bid=["\']([^"\']+)["\'][^>]*>',html,re.I)}
          ids=['ordanModel','ordanHairModel']
          report={'model_elements':{},'asset_elements':{},'copied':[],'errors':[]}
          for name in ids:
            found=re.search(r'<pc-model\b[^>]*\bid=["\']'+re.escape(name)+r'["\'][^>]*>',html,re.I)
            if not found:
              report['errors'].append('Missing model element '+name);continue
            tag=found.group(0)
            report['model_elements'][name]=tag[:1500]
            attrs=dict(re.findall(r'([\w-]+)=["\']([^"\']*)["\']',tag))
            assetid=attrs.get('asset','').lstrip('#')
            assettag=asset_tags.get(assetid,'')
            report['asset_elements'][assetid]=assettag[:1600]
            assetattrs=dict(re.findall(r'([\w-]+)=["\']([^"\']*)["\']',assettag))
            src=assetattrs.get('src') or assetattrs.get('data-src') or ''
            if not src:
              report['errors'].append('Missing asset src for '+name+' via '+assetid);continue
            try:
              if src.startswith('data:'):
                header,data=src.split(',',1)
                blob=base64.b64decode(data) if ';base64' in header else urllib.parse.unquote_to_bytes(data)
              elif src.startswith(('http://','https://')):
                blob=urllib.request.urlopen(src,timeout=90).read()
              else:
                local=pathlib.Path(urllib.parse.urlsplit(src).path.lstrip('/'))
                if not local.is_file():raise FileNotFoundError(str(local))
                blob=local.read_bytes()
              if len(blob)<20 or blob[:4]!=b'glTF' or struct.unpack_from('<I',blob,8)[0]!=len(blob):
                raise ValueError('Not valid binary GLB; retain reference only')
              dst=target/(name+'.glb')
              dst.write_bytes(blob)
              report['copied'].append({'name':name,'path':str(dst),'bytes':len(blob),'source':src[:240] if not src.startswith('data:') else 'embedded data URI'})
            except Exception as exc:
              report['errors'].append(name+': '+str(exc))
          (target/'RECOVERY_REPORT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2)[:8000])
          PY
      - name: Commit original GLBs and recovery report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/playcanvas/approved/characters/ordan
          git diff --cached --quiet || { git commit -m "assets: recover Ordan original Canvas models"; git push; }
