name: Genesis V014.028 | Fabricaciones real QA
on:
  push:
    branches:
      - release/v014028-fabricaciones-quest-loop-20261108
  pull_request:
    paths:
      - genesis_ui_approved.js
      - genesis_ui_approved.css
      - preparacion_control.js
      - tests/approved_ui_four_screens.cjs
      - .github/workflows/v014028-fabricaciones-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-crafting:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: |
          node --check genesis_ui_approved.js
          node --check preparacion_control.js
          node --check tests/approved_ui_four_screens.cjs
      - name: Install Playwright
        run: npm install --prefix /tmp/genesis-test playwright@1.56.1
      - name: Run actual approved crafting UI and quest-selection checks
        run: NODE_PATH=/tmp/genesis-test/node_modules node tests/approved_ui_four_screens.cjs
      - name: Archive real visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-v014028-fabricaciones-captures
          path: previews/approved-ui-four-screens/
          retention-days: 14
