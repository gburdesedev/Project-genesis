name: V014022 repaired model URL real browser test
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/v014022-fix-broken-smith-asset-urls-20261105
    paths:
      - .github/workflows/v014022-persist-broken-url-repair.yml
      - tools/repair_v014022_verified_urls.py
      - tools/move_herrero_chest_near_ordan.py
      - tests/v014022_ordan_full_e2e.cjs
permissions:
  contents: write
jobs:
  repair-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Verify and repair original URLs in isolated version
        run: python3 tools/repair_v014022_verified_urls.py
      - name: Move blacksmith chest near Ordan's key handoff (only experiment)
        run: python3 tools/move_herrero_chest_near_ordan.py
      - name: Commit repaired playable HTML to experimental branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "fix(experiment): move chest near Ordan and preserve repaired smith URLs"
            git push origin HEAD:experiment/v014022-fix-broken-smith-asset-urls-20261105
          fi
      - name: Install Playwright test package (browser is included in runner image)
        run: npm install --prefix /tmp/genesis-playwright playwright@1.56.1
      - name: Validate real browser test
        run: node --check tests/v014022_ordan_full_e2e.cjs
      - name: Run repaired game with real mouse and keyboard
        id: gameplay
        continue-on-error: true
        env:
          NODE_PATH: /tmp/genesis-playwright/node_modules
        run: node tests/v014022_ordan_full_e2e.cjs
      - name: Upload actual gameplay report and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v014022-repaired-url-real-journey
          path: previews/v014022-ordan-playwright/
          retention-days: 7
          if-no-files-found: warn
      - name: Fail if the journey did not finish
        if: always()
        env:
          RESULT: ${{ steps.gameplay.outcome }}
        run: test "$RESULT" = success
