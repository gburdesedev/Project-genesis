name: Genesis UI | three approved screens + provisional result
on:
  push:
    branches:
      - experiment/ui-approved-four-screens-20261108
      - main
    paths:
      - 'genesis_ui_approved.*'
      - 'preparacion_control.js'
      - 'assets/ui/approved/**'
      - 'tests/approved_ui_four_screens.cjs'
      - '.github/workflows/approved-ui-integration-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check preparacion_control.js
          node --check genesis_ui_approved.js
          node --check tests/approved_ui_four_screens.cjs
      - name: Install Playwright
        run: npm install --prefix /tmp/genesis-approved-ui --no-audit --no-fund playwright@1.56.1
      - name: Verify original SHA256 artwork and interactive screens
        env:
          NODE_PATH: /tmp/genesis-approved-ui/node_modules
        run: node tests/approved_ui_four_screens.cjs
      - name: Upload visual QA and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-approved-ui-three-screens
          path: previews/approved-ui-four-screens/
          if-no-files-found: warn
          retention-days: 21
