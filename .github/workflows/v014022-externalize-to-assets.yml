name: Externalize original V014022 inline assets (experimental)
on:
  push:
    branches: ['experiment/v014022-restore-assets-playwright-20261108']
    paths: ['.github/workflows/v014022-externalize-to-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  externalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/v014022-restore-assets-playwright-20261108
          persist-credentials: true
      - name: Verify remote GLBs and replace only inline src references
        run: |
          python3 - <<'PY'
          import pathlib,re,urllib.request,json,hashlib
          root=pathlib.Path('index.html')
          html=root.read_text()
          base='https://raw.githubusercontent.com/ProjectgenesisAssets/genesis-workshop-assets/experiment/v014022-externalize-embedded-20261108/'
          manifest_url=base+'integration/v014022/manifest.json'
          with urllib.request.urlopen(manifest_url,timeout=60) as resp: manifest=json.load(resp)
          entries=manifest['files']
          verified={}
          for ident,info in entries.items():
           url=base+info['path']
           with urllib.request.urlopen(url,timeout=80) as resp: blob=resp.read()
           digest=hashlib.sha256(blob).hexdigest()
           if digest!=info['sha256']:raise RuntimeError('SHA mismatch: '+ident)
           verified[ident]=url
          print('VERIFIED_REMOTE_ASSETS',len(verified))
          changed=[]
          def replace(match):
           tag=match.group(0)
           m=re.search(r'\bid="([^"]+)"',tag)
           if not m or m.group(1) not in verified:return tag
           ident=m.group(1)
           before=re.search(r'\bsrc="([^"]+)"',tag)
           if not before or not before.group(1).startswith('data:'):raise RuntimeError('Expected inline data for '+ident)
           replaced=tag[:before.start(1)]+verified[ident]+tag[before.end(1):]
           changed.append(ident)
           return replaced
          updated=re.sub(r'<pc-asset\b[^>]*>',replace,html)
          if set(changed)!=set(entries):raise RuntimeError('Manifest asset mismatch: '+repr(set(entries)-set(changed)))
          root.write_text(updated)
          print('EXTERNALIZED_MODELS',len(changed),'HTML_SIZE_BEFORE',len(html.encode()),'AFTER',len(updated.encode()))
          
          PY
      - name: Commit original game with external resource URLs only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git diff --cached --stat
          git commit -m 'assets(v014022): load 17 original GLBs from organization repository'
          git push origin HEAD:experiment/v014022-restore-assets-playwright-20261108
