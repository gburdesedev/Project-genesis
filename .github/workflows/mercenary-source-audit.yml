name: Mercenary read-only source audit
on:
  push:
    branches: ['feature/mercenary-equipment-runtime-v001']
    paths:
      - 'tests/mercenary_source_audit.cjs'
      - '.github/workflows/mercenary-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Extract actual game contracts and hooks
        run: node tests/mercenary_source_audit.cjs
