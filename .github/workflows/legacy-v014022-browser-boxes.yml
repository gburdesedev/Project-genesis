name: Legacy V0.14.022 browser loading boxes QA
on:
  push:
    branches: [experiment/legacy-v014022-approved-assets-loader-20261105]
    paths:
      - '.github/workflows/legacy-v014022-browser-boxes.yml'
      - 'tools/legacy_v014022_browser_smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-boxes:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium and Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser loading boxes on desktop and mobile landscape
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/legacy-v014022-server.log 2>&1 &
          node tools/legacy_v014022_browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-v014022-loader-boxes-qa
          path: previews/legacy-v014022-loader-qa/
          retention-days: 7
