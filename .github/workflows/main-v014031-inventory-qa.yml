name: Genesis main | Inventario aprobado V014031 1a1
on:
  push:
    branches: [main]
    paths:
      - 'inventario_genesis_16x9.*'
      - 'inventario_arte_aprobado_1to1.css'
      - 'preparacion_control.js'
      - 'assets/ui/inventario/**'
      - 'assets/playcanvas/approved/materials/**'
      - '.github/workflows/main-v014031-inventory-qa.yml'
      - 'tests/main_v014031_inventory_approved.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check preparacion_control.js
          node --check inventario_genesis_16x9.js
          node --check tests/main_v014031_inventory_approved.cjs
      - name: Install Playwright runner
        run: npm install --prefix /tmp/genesis-031-main --no-audit --no-fund playwright@1.56.1
      - name: Verify exact approved image, interactive slots and 16:9 screenshots
        env:
          NODE_PATH: /tmp/genesis-031-main/node_modules
        run: node tests/main_v014031_inventory_approved.cjs
      - name: Preserve screenshots and audit even when failing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-v014031-inventario-aprobado
          path: previews/main-v014031-inventory-approved/
          if-no-files-found: warn
          retention-days: 21
