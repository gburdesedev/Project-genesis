name: Vendor PlayCanvas runtime assets locally
on:
  push:
    branches:
      - feature/local-playcanvas-assets-20261103
    paths:
      - tools/localize_runtime_assets.py
      - .github/workflows/local-playcanvas-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get canonical inventory and original-byte mirroring tool
        run: |
          mkdir -p /tmp/genesis-vendor
          curl -fL --retry 3 --connect-timeout 30 "https://raw.githubusercontent.com/ProjectgenesisAssets/genesis-workshop-assets/feature/playcanvas-master-20261103/playcanvas-runtime/manifest.json" -o /tmp/genesis-vendor/manifest.json
          curl -fL --retry 3 --connect-timeout 30 "https://raw.githubusercontent.com/ProjectgenesisAssets/genesis-workshop-assets/feature/playcanvas-master-20261103/playcanvas-runtime/mirror.py" -o /tmp/genesis-vendor/mirror.py
      - name: Download and validate original models with all glTF dependencies
        run: python /tmp/genesis-vendor/mirror.py --manifest /tmp/genesis-vendor/manifest.json --root assets/vendor/genesis/externals --lock /tmp/genesis-vendor/lock.json
      - name: Rewrite remote URLs only after successful hash validation
        run: python tools/localize_runtime_assets.py --manifest /tmp/genesis-vendor/manifest.json --lock /tmp/genesis-vendor/lock.json --asset-root assets/vendor/genesis/externals
      - name: Commit local models and updated paths to experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "assets: install 22 local WebGL models and replace external runtime URLs"
            git push
          fi
