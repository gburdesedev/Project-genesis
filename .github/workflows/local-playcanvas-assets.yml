name: Vendor PlayCanvas runtime assets locally
on:
  push:
    branches:
      - feature/local-playcanvas-assets-20261103
    paths:
      - tools/localize_runtime_assets.py
      - .github/workflows/local-playcanvas-assets.yml
  pull_request:
    branches:
      - main
    paths:
      - 'playcanvas-runtime/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned master lock and manifest
        run: |
          mkdir -p /tmp/genesis-vendor
          curl -fL --retry 3 --connect-timeout 30 "https://raw.githubusercontent.com/ProjectgenesisAssets/genesis-workshop-assets/dc8b899333f33a80101f7b3c386f5e6a1bf963dd/playcanvas-runtime/manifest.json" -o /tmp/genesis-vendor/manifest.json
          curl -fL --retry 3 --connect-timeout 30 "https://raw.githubusercontent.com/ProjectgenesisAssets/genesis-workshop-assets/dc8b899333f33a80101f7b3c386f5e6a1bf963dd/playcanvas-runtime/lock.json" -o /tmp/genesis-vendor/lock.json
      - name: Copy verified bytes from master into demo
        run: python tools/install_master_runtime.py --lock /tmp/genesis-vendor/lock.json --root assets/vendor/genesis/externals --master-sha dc8b899333f33a80101f7b3c386f5e6a1bf963dd
      - name: Rewrite remote URLs only after successful hash validation
        run: python tools/localize_runtime_assets.py --manifest /tmp/genesis-vendor/manifest.json --lock /tmp/genesis-vendor/lock.json --asset-root assets/vendor/genesis/externals
      - name: Commit local models and updated paths to experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "assets: install 22 local WebGL models and replace external runtime URLs"
            git push
          fi
