name: Validate published v0.15 preview (current version)
on:
  push:
    branches: [main]
    paths:
      - 'v015/**'
      - '.github/workflows/deploy-v015-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate current preview without overwriting published files
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('v015')
          page=(root/'index.html').read_text()
          manifest=json.loads((root/'manifest.json').read_text())
          assert 'PROJECT GENESIS' in page, 'Genesis menu missing'
          assert 'Project Genesis 0.15 '+manifest['version'].split('-')[-1].upper() in page, 'Build title does not match manifest'
          assert manifest['version'].startswith('0.15-v'), 'Unexpected manifest version'
          for c in manifest['characters']:
              path=(root/c['file']).resolve()
              assert path.is_file(),f"Missing asset: {path}"
          print(manifest['version']+' publication files verified; no overwrite or extra commit')
          PY
