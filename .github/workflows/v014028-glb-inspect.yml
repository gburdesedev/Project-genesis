name: V014.028 | Inspect actual mercenary and gear GLB animation structure
on:
  push:
    branches: [experiment/v014028-mercenary-v09-real-craft-playwright-20261107]
    paths: [.github/workflows/v014028-glb-inspect.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual local GLB animations without changing any asset
        run: |
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          for p in ['assets/vendor/genesis/externals/peasantMale086/src/male_peasant.glb','assets/vendor/genesis/externals/rangerMale086/src/male_ranger.glb','assets/vendor/genesis/externals/mercSword10/src/sword.glb','assets/vendor/genesis/externals/mercShield10/src/shield_round.glb']:
            b=Path(p).read_bytes()
            magic,version,length=struct.unpack_from('<III',b,0)
            nch,tag=struct.unpack_from('<I4s',b,12)
            gltf=json.loads(b[20:20+nch])
            print('GLB_INSPECT',json.dumps({'path':p,'bytes':len(b),'magic':hex(magic),'version':version,'animations':[x.get('name','unnamed') for x in gltf.get('animations',[])],'meshCount':len(gltf.get('meshes',[])),'nodes':len(gltf.get('nodes',[])),'skins':len(gltf.get('skins',[])),'materials':len(gltf.get('materials',[]))}))
          PY
