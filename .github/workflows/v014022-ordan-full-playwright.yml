name: V014022 Ordan complete browser journey with persisted report
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/v014022-ordan-playwright-full-run-20261105
    paths:
      - tests/v014022_ordan_full_e2e.cjs
      - .github/workflows/v014022-ordan-full-playwright.yml
permissions:
  contents: write
jobs:
  desktop-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --prefix /tmp/ordan-playwright playwright@1.56.1
      - name: Verify test syntax
        run: node --check tests/v014022_ordan_full_e2e.cjs
      - name: Play archived V014022 with keyboard and mouse without changing gameplay
        id: ordan
        continue-on-error: true
        env:
          NODE_PATH: /tmp/ordan-playwright/node_modules
        run: node tests/v014022_ordan_full_e2e.cjs
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v014022-ordan-full-playwright-evidence
          path: previews/v014022-ordan-playwright
          if-no-files-found: warn
          retention-days: 7
      - name: Save direct-access JSON report on experiment branch
        if: always()
        shell: bash
        run: |
          mkdir -p previews/v014022-ordan-playwright
          if test -f previews/v014022-ordan-playwright/report.json; then
            cp previews/v014022-ordan-playwright/report.json previews/v014022-ordan-playwright/latest-report.json
          else
            printf '{"result":"NO_REPORT","blocker":"Playwright failed before writing report.json","run":"%s","testOutcome":"%s"}\n' "$GITHUB_RUN_ID" "${{ steps.ordan.outcome }}" > previews/v014022-ordan-playwright/latest-report.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/v014022-ordan-playwright/latest-report.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: persist real V014022 Ordan journey report ($GITHUB_RUN_ID)"
            git push origin HEAD:experiment/v014022-ordan-playwright-full-run-20261105
          fi
