name: V014022 Ordan full Playwright walk (experimental)
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/v014022-ordan-playwright-full-run-20261105
      - experiment/v014022-recover-anvil-bellows-20261105
    paths:
      - tests/v014022_ordan_full_e2e.cjs
      - .github/workflows/v014022-ordan-full-playwright.yml
permissions:
  contents: read
jobs:
  desktop-game:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright test runner
        run: npm install --prefix /tmp/ordan-playwright playwright@1.56.1
      - name: Verify test syntax
        run: node --check tests/v014022_ordan_full_e2e.cjs
      - name: Play real archived V014022 through Ordan tutorial by mouse/keyboard
        env:
          NODE_PATH: /tmp/ordan-playwright/node_modules
        run: node tests/v014022_ordan_full_e2e.cjs
      - name: Preserve all screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v014022-ordan-full-playwright-evidence
          path: previews/v014022-ordan-playwright
          if-no-files-found: warn
          retention-days: 7
