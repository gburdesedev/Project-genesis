name: Genesis | current main release metadata audit
on:
  push:
    branches: ['integration/stable-patches-20261108']
    paths:
      - '.github/workflows/audit-release-tags-20261108.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Display precise title / HUD / build / cache token references
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          patterns=[r'<title>[^<]*',r'v0[.]14[.]\d+',r'V014[.]\d+',r'v0[.]17[.]\d+',r'BUILD_[A-Z_]+',r'genesis_ui_approved[.]js[^"\']*']
          for p in patterns:
              matches=list(re.finditer(p,s,re.I))
              print('PATTERN',p,'TOTAL',len(matches))
              for m in matches[:25]:
                  print('LOC',s.count('\n',0,m.start())+1,repr(s[max(0,m.start()-95):m.end()+95]))
          PY
