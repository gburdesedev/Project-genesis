name: V017 Independent Preview — Desktop + Mobile
on:
  push:
    branches: [preview/v017-playtest]
    paths:
      - 'v017/**'
      - 'assets/playcanvas/approved/workshops/**'
      - 'assets/playcanvas/approved/lighting/**'
      - 'tools/v017_preview_browser_smoke.cjs'
      - '.github/workflows/v017-preview-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preview save isolation and original V016 source intact
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          for(const file of ['index.html','canvas-legacy-logic.js','manifest.json']){
            const s=fs.readFileSync('v017/'+file,'utf8');
            assert(s.includes('project-genesis/canvas-original/v017-preview'),file+' has wrong save key');
            assert(!s.includes('project-genesis/canvas-original/v013'),file+' could overwrite published V016 save');
          }
          assert(fs.readFileSync('v015/canvas-legacy-logic.js','utf8').includes('project-genesis/canvas-original/v013'),'V016 original save key touched');
          const page=fs.readFileSync('v017/index.html','utf8');
          const manifest=JSON.parse(fs.readFileSync('v017/manifest.json','utf8'));
          assert.equal(manifest.version,'0.15-v017');
          for(const entry of manifest.workshopAssets){
            assert(fs.existsSync(require('node:path').resolve('v017',entry.file)),'Missing model '+entry.id);
          }
          assert(page.includes('v017-village.js')&&page.includes('genesis-v017-loading'));
          console.log('V017 isolated preview key, 4 approved models and HDRI verified; V016 save intact');
          NODE
      - name: Install Playwright browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual V017 preview route on desktop and mobile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v017-preview-http.log 2>&1 &
          node tools/v017_preview_browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v017-preview-browser-evidence
          path: /tmp/v017-browser-qa
          retention-days: 10
