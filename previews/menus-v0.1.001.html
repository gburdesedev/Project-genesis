<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Genesis · Estudio de menús v0.1.001</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d100f;color:#e4d9ba;font-family:Georgia,serif}button{font:inherit;color:inherit;cursor:pointer}header{height:62px;display:flex;justify-content:space-between;align-items:center;padding:10px 24px;border-bottom:1px solid #59492b;background:#141917}header b{font-size:16px;letter-spacing:2px}header small{color:#b6a47b;font:12px system-ui}#viewport{height:calc(100dvh - 62px);display:grid;place-items:center;overflow:hidden}#wrapper{position:relative}#board{width:1536px;height:1024px;position:absolute;transform-origin:top left;background:url('../assets/ui/preparacion/01_Capas/Fondo/FondoEstructural.png') center/100% 100%;overflow:hidden}.tab{position:absolute;border:0;background:transparent;height:94px;top:42px;padding:0;isolation:isolate}.tab img{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.tab[aria-selected=true] img{filter:brightness(1.55)}.tab span{display:block;background:#24251fe8;width:80%;margin:auto;padding:12px 4px;font-size:23px;letter-spacing:1.4px;color:#bba77a}.tab[aria-selected=true] span{color:#ffe4a0;text-shadow:0 0 16px #f6ba58}.tab[aria-selected=true]:after{content:'';position:absolute;bottom:9px;left:20%;right:20%;height:2px;background:#deae54;box-shadow:0 0 12px #f6bf60}.ey{font:13px system-ui;letter-spacing:2px;color:#c9aa64;text-transform:uppercase}h1{font-size:32px;font-weight:400;margin:9px 0 12px}h2{font-size:23px;font-weight:400;margin:0 0 17px}h3{font-size:20px;font-weight:400;margin:5px 0 12px}.panel{border:1px solid #75603b;box-shadow:inset 0 0 30px #0008,0 5px 15px #0005;background:linear-gradient(110deg,#262921ed,#151c19f0);padding:24px;position:absolute;top:180px;height:710px}.left{left:52px;width:477px}.center{left:553px;width:460px}.right{left:1037px;width:447px}.lead{position:absolute;top:148px;left:55px;font:12px system-ui;letter-spacing:1px;color:#a99872}.filters{display:flex;gap:8px;margin:18px 0}.chip{border:1px solid #695733;background:#121915;padding:9px 14px;font:13px system-ui}.chip.active{border-color:#d2a34c;color:#f7da91;background:#493d25}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:19px 0}.slot{aspect-ratio:1;border:1px solid #645333;background:radial-gradient(ellipse at center,#45483a,#111a16);position:relative;padding:5px}.slot.selected{border-color:#e2b65a;box-shadow:inset 0 0 14px #e2b65a35}.slot img{width:100%;height:100%;object-fit:contain}.slot.ore img{transform:scale(1.65) translateY(-10%)}.slot b{position:absolute;right:7px;bottom:5px;font:15px system-ui;text-shadow:1px 1px #000}.slot.empty:after{content:'◇';color:#675c42;font-size:25px}.rule{border-top:1px solid #655333;margin:23px 0}.muted{color:#a99f83;font:15px/1.6 system-ui}p{line-height:1.6}.hero{height:285px;background:radial-gradient(ellipse,#62624b45,transparent 70%);display:grid;place-items:center;margin:4px -12px}.hero img{height:100%;width:100%;object-fit:contain;filter:drop-shadow(0 12px 13px #000a)}.hero.ore img{transform:scale(1.45)}.tag{display:inline-block;font:12px system-ui;letter-spacing:1px;border:1px solid #71613b;color:#dfc486;padding:7px 11px}.row{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #5b503b;padding:13px 0;font:15px system-ui}.row b{color:#e6c983;font-weight:500}.action{width:100%;border:1px solid #b28a46;background:linear-gradient(#655032,#352a1d);padding:17px;margin-top:22px;color:#ffe4a5;letter-spacing:1px;font-size:19px}.action:disabled{opacity:.55;cursor:default}.note{position:absolute;bottom:51px;left:57px;right:57px;display:flex;justify-content:space-between;font:13px system-ui;color:#af9e78}.recipe{display:block;width:100%;text-align:left;padding:19px 14px;margin:10px 0;border:1px solid #665532;background:#192019}.recipe.selected{border-color:#d1a453;background:#3e3827}.recipe span{display:block;color:#b5a98a;font:13px system-ui;margin-top:8px}.placeholder{border:1px dashed #81704a;margin:36px 20px;text-align:center;padding:42px 20px;color:#c2ad78;line-height:1.8}.compare .left{width:477px}.compare .center{width:460px}.compare .right{width:447px}.bar{height:5px;background:#121a15;margin:10px 0 20px}.bar i{display:block;height:100%;background:#baa05c}.message{min-height:25px;font:13px system-ui;color:#d8bb79;margin-top:16px}.legend{font:12px/1.5 system-ui;color:#a99b7c}
</style></head><body><header><b>PROJECT GENESIS <small>· ESTUDIO DE MENÚS v0.1.001</small></b><small>MAQUETA NAVEGABLE · DATOS DE EJEMPLO</small></header><main id="viewport"><div id="wrapper"><div id="board"><nav role="tablist" aria-label="Menús del artesano"></nav><div id="content"></div><footer class="note"><span>Un mismo marco · materiales, oficio y creaciones</span><span>Estudio v0.1.001 · no modifica tu partida</span></footer></div></div></main>
<script>
const asset='../assets/playcanvas/approved/materials/',ore=asset+'iron_ore/v008_55k_pbr1536_v007/mineral_hierro_v008_transparent_0.png',ingot=asset+'iron/v175/iron_v175_transparent.png';
const tabs=[['Inventario','Inventario',164,294],['Preparacion','Preparación',458,320],['Fabricaciones','Fabricación',778,328],['Comparacion','Comparación',1106,298]];let tab='Inventario',selected='ore',filter='Todos',recipe='Espada de hierro';
function sync(){const s=Math.min((innerWidth-12)/1536,(innerHeight-74)/1024,1);wrapper.style.width=1536*s+'px';wrapper.style.height=1024*s+'px';board.style.transform=`scale(${s})`}addEventListener('resize',sync);sync();
function rows(items){return items.map(([a,b])=>`<div class="row"><span>${a}</span><b>${b}</b></div>`).join('')}
function slot(kind,n){return `<button class="slot ${kind} ${selected===kind?'selected':''}" data-item="${kind}" aria-label="${kind==='ore'?'Mineral de hierro':'Lingote de hierro'}"><img src="${kind==='ore'?ore:ingot}" alt=""><b>${n}</b></button>`}
function detail(){const raw=selected==='ore';return `<div class="ey">MATERIAL SELECCIONADO</div><h1>${raw?'Mineral de hierro':'Lingote de hierro'}</h1><span class="tag">${raw?'EN BRUTO':'PREPARADO'}</span><div class="hero ${raw?'ore':''}"><img src="${raw?ore:ingot}" alt="${raw?'Mineral':'Lingote'} de hierro"></div><p class="muted">${raw?'Materia prima que se transforma en lingotes en la fragua del taller.':'Material preparado para utilizar en las fórmulas de fabricación.'}</p>`}
function render(){document.querySelector('nav').innerHTML=tabs.map(([id,label,x,w])=>`<button role="tab" class="tab" style="left:${x}px;width:${w}px" aria-selected="${tab===id}" aria-label="${label}" data-tab="${id}"><img src="../assets/ui/preparacion/01_Capas/Pestanas/Pestana_${id}.png" alt=""></button>`).join('');
let html='';if(tab==='Inventario'){html=`<div class="lead">TALLER DEL HERRERO / INVENTARIO DEL ARTESANO</div><section class="panel left"><div class="ey">ALMACÉN DEL TALLER</div><h1>Materiales y creaciones</h1><div class="filters">${['Todos','En bruto','Preparados'].map(f=>`<button class="chip ${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><h3>Materiales</h3><div class="slots">${filter!=='Preparados'?slot('ore',10):''}${filter!=='En bruto'?slot('ingot',2):''}${'<button class="slot empty" disabled aria-label="Casilla vacía"></button>'.repeat(6)}</div><div class="rule"></div><h3>Objetos fabricados</h3><p class="muted">Acá aparecerán tus creaciones con su rareza y afinidad. Seleccionar un objeto abrirá su ficha en el visor central.</p><div class="slots">${'<button class="slot empty" disabled aria-label="Sin objeto fabricado"></button>'.repeat(4)}</div><p class="legend">Las casillas vacías conservan su lugar.</p></section><section class="panel center">${detail()}</section><aside class="panel right"><div class="ey">FICHA DEL MATERIAL</div><h1>Existencias y uso</h1>${rows([['Cantidad disponible',selected==='ore'?'10 unidades':'2 unidades'],['Estado',selected==='ore'?'En bruto':'Preparado'],['Oficio','Herrero'],['Destino',selected==='ore'?'Preparación':'Fabricación']])}<div class="rule"></div><p class="muted">La información cambia al seleccionar una casilla. Las fórmulas y la ficha de los objetos tendrán su propio contenido.</p><button class="action" data-goto="${selected==='ore'?'Preparacion':'Fabricaciones'}">${selected==='ore'?'IR A PREPARACIÓN':'VER FABRICACIÓN'}</button><div class="message" aria-live="polite"></div></aside>`}
else if(tab==='Preparacion'){html=`<div class="lead">REFERENCIA EXISTENTE / DISTRIBUCIÓN APROBADA</div><section class="panel left"><div class="ey">PREPARACIÓN ACTUAL</div><h1>Base visual aprobada</h1><p>Se conserva el menú actual con sus casillas, visor, controles de cantidad y minijuego de temperatura.</p><div class="slots">${slot('ore',10)}${slot('ingot',2)}</div><p class="muted">Esta maqueta permite estudiar los otros menús. La preparación jugable sigue disponible en la versión publicada.</p><a class="action" style="display:block;text-align:center;text-decoration:none" href="../index.html?v=0.11.006" target="_blank" rel="noopener">ABRIR EL JUEGO</a></section><section class="panel center">${detail()}</section><aside class="panel right"><div class="ey">REGLAS QUE CONSERVAMOS</div><h1>Preparar materiales</h1>${rows([['Entrada','Mineral'],['Salida','Lingotes'],['Control','Fuelle y temperatura'],['Cantidad','Lote seleccionado']])}<p class="muted">Preparación y fabricación son procesos separados. Esta pantalla de estudio no ejecuta ni reemplaza el minijuego.</p></aside>`}
else if(tab==='Fabricaciones'){html=`<div class="lead">TALLER DEL HERRERO / FÓRMULAS CONOCIDAS</div><section class="panel left"><div class="ey">RECETARIO</div><h1>Elegir fabricación</h1>${['Espada de hierro','Escudo de hierro'].map(n=>`<button class="recipe ${recipe===n?'selected':''}" data-recipe="${n}">${n}<span>Familia conocida · ejemplo visual</span></button>`).join('')}<div class="rule"></div><h3>Fórmula seleccionada</h3><p class="muted">Los materiales y las cantidades se tomarán de la fórmula real del personaje.</p><p class="legend">El prototipo visual no agrega recetas ni cambia la resolución del crafteo.</p></section><section class="panel center"><div class="ey">OBJETO A FABRICAR</div><h1>${recipe}</h1><span class="tag">VISTA DEL OBJETO</span><div class="placeholder">VISOR RESERVADO<br><small>Asset final pendiente de integración</small></div><h3>Material preparado</h3><div class="hero" style="height:150px"><img src="${ingot}" alt="Lingote de hierro"></div><p class="legend">La vista previa identifica la familia; el resultado se conoce después de fabricar.</p></section><aside class="panel right"><div class="ey">ANTES DE COMENZAR</div><h1>Materiales y fórmula</h1>${rows([['Material','Lingote de hierro'],['Disponibles','2'],['Necesarios','Según fórmula'],['Resultado','Se resuelve al fabricar']])}<div class="rule"></div><p class="muted">Aquí se mostrarán faltantes, fórmula y condiciones del oficio. La rareza final no se promete por adelantado.</p><button class="action" disabled>FABRICAR · VISTA DE DISEÑO</button></aside>`}
else{html=`<div class="lead">MISMA FAMILIA / DOS FABRICACIONES SELECCIONADAS</div><section class="panel left"><div class="ey">FABRICACIÓN A · EJEMPLO</div><h1>Espada de hierro</h1><span class="tag">INÚTIL</span><div class="placeholder">VISOR A<br><small>Objeto fabricado seleccionado</small></div>${rows([['Familia','Espada'],['Fórmula','Compartida'],['Afinidad','Según resultado']])}<p class="muted">Se conserva la ficha completa de cada creación.</p></section><section class="panel center"><div class="ey">LECTURA COMPARATIVA</div><h1>Dos cierres distintos</h1><p>Comparar los resultados de una misma fórmula permite ver lo que cambió entre fabricaciones.</p><div class="rule"></div>${rows([['Materiales','Misma fórmula'],['Rareza','A frente a B'],['Propiedades','Valores reales'],['Afinidades','Canales activos']])}<p class="muted">Las diferencias se resaltarán con sus números reales. No se inventan estadísticas para esta maqueta.</p><div class="rule"></div><button class="action" data-goto="Inventario">VOLVER AL INVENTARIO</button></section><aside class="panel right"><div class="ey">FABRICACIÓN B · EJEMPLO</div><h1>Espada de hierro</h1><span class="tag" style="color:#c9dab5">COMÚN</span><div class="placeholder">VISOR B<br><small>Segunda creación seleccionada</small></div>${rows([['Familia','Espada'],['Fórmula','Compartida'],['Afinidad','Según resultado']])}<p class="muted">El halo y los detalles se mostrarán cuando estén sus assets finales.</p></aside>`}
content.innerHTML=html;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{tab=b.dataset.goto;render()});document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{selected=b.dataset.item;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>{recipe=b.dataset.recipe;render()})}render();
</script></body></html>
