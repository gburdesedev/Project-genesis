<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Genesis · prueba real fragua V038 y fuente HQ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1115;color:#f3e2b8;font:12px system-ui,sans-serif}
#game{position:absolute;inset:0;width:100%;height:100%;border:0}
#label{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:10px;max-width:58vw;z-index:20;background:#111a1ee8;border:1px solid #b28c50;border-radius:6px;padding:8px 10px;line-height:1.5}
#label b{color:#efc887}#details{display:none}#label.open #details{display:block}
#label{cursor:pointer}button{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));right:10px;z-index:20;max-width:35vw;background:#292019;color:#f7dda4;border:1px solid #b18c51;border-radius:5px;padding:10px;cursor:pointer}
</style>
</head><body>
<iframe id="game" loading="eager" allow="fullscreen" title="Project Genesis: fuente V011 HQ y fragua V038" src="../genesis-v038-fuente-hq-preview.html"></iframe>
<div id="label"><b>PRUEBA V038 + DELFÍN V011 HQ · FIX 005</b><div id="details">Fuente: esperando motor · Fragua: esperando motor<div id="errors"></div></div></div>
<button id="toggle" type="button">Comparar con juego principal</button>
<script>
(()=>{
const frame=document.getElementById('game'),button=document.getElementById('toggle'),badge=document.getElementById('label'),details=document.getElementById('details'),errors=document.getElementById('errors');
let alternate=false;badge.addEventListener('click',()=>badge.classList.toggle('open'));
button.addEventListener('click',()=>{alternate=!alternate;frame.src=alternate?'../index.html':'../genesis-v038-fuente-hq-preview.html';button.textContent=alternate?'Volver a prueba HQ + V038':'Comparar con juego principal';details.textContent=alternate?'Juego original sin cambios':'Prueba cargando';});
window.addEventListener('message',event=>{
if(event.source!==frame.contentWindow||event.origin!==location.origin||event.data?.kind!=='genesisHQFountainForgeQA')return;
const d=event.data.data||{};
details.textContent='Fuente HQ: '+(d.fountain||'pendiente')+' · Fragua V038: '+(d.forge||'pendiente')+' · Agua: '+(d.waterMaterials||0)+' materiales · Mallas fragua: '+(d.forgeMeshes??'…')+' · Sombras desactivadas: '+(d.forgeShadowRenderersDisabled??'…')+' · FPS medidos: '+(d.fpsObserved??'…')+' · Draw calls: '+(d.drawCalls??'…');
if(d.errors?.length)details.textContent+=' · Error: '+String(d.errors[0]).slice(0,160);
});
frame.addEventListener('error',()=>details.textContent='Error cargando la prueba: revisar consola de navegador.');
})();
</script></body></html>
