<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Project Genesis · Ciudad 63 × 63</title>
<style>
:root{color-scheme:dark;font-family:Georgia,serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#100f0c;color:#f0e2c0;overflow:hidden}
#game{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.pill{border:1px solid #aa854b;background:#17130de8;border-radius:7px;padding:8px 10px;box-shadow:0 2px 10px #0008;font-size:13px}strong{color:#ffd18b}#notice{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:1px solid #8b683d;background:#17120def;padding:10px 14px;border-radius:8px;max-width:min(570px,90vw);text-align:center;pointer-events:none;font-size:14px}#dpad{position:fixed;bottom:max(68px,calc(env(safe-area-inset-bottom) + 65px));left:15px;display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:48px 48px 48px;gap:3px;touch-action:none}#dpad button{font-size:22px;border:1px solid #b68c4a;color:#ffe8b4;background:#19140de8;border-radius:9px;touch-action:none}#dpad button[data-dir="up"]{grid-column:2}#dpad button[data-dir="left"]{grid-column:1;grid-row:2}#dpad button[data-dir="down"]{grid-column:2;grid-row:2}#dpad button[data-dir="right"]{grid-column:3;grid-row:2}#action{position:fixed;right:16px;bottom:max(90px,calc(env(safe-area-inset-bottom) + 84px));border:1px solid #d1a15e;background:#513417ee;color:#ffe3a2;border-radius:50%;height:66px;width:66px;font-size:12px;font-weight:700}#zoom{position:fixed;right:16px;top:78px;display:flex;gap:5px}#zoom button{background:#241b12;color:#ffe8c2;border:1px solid #9f7848;border-radius:7px;font-size:23px;width:42px;height:40px}button{cursor:pointer}#legend{position:fixed;right:16px;top:127px;background:#17120dcf;border:1px solid #715a3a;padding:7px 9px;border-radius:6px;font-size:11px}
@media (pointer:fine){#dpad{opacity:.48}#dpad:hover{opacity:1}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="pill"><strong>PROJECT GENESIS</strong> · Ciudad 63×63</div><div class="pill" id="pos">Posición: 31, 56</div><div class="pill">Herrería: interior disponible · Otros talleres: fachadas</div></div><div id="zoom"><button id="minus">−</button><button id="plus">+</button></div><div id="legend">Mover: WASD / flechas / táctil<br>Arrastrar fondo: desplazar cámara<br>Rueda: zoom · E: interactuar</div><div id="dpad"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><button id="action">ENTRAR /<br>VER</button><div id="notice">Recorré los caminos de piedra para visitar los cinco talleres, la plaza y el mercado.</div>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),posEl=document.getElementById('pos'),notice=document.getElementById('notice');
const N=63,T=32;let zoom=1.08,scale=1,dx=0,dy=0,w=0,h=0,last=0,lastNotice=0;const player={x:31.5,y:56.5};let keys=new Set(),pointer=null;
const places=[
{name:'HERRERÍA',x:10,y:15,w:12,h:12,color:'#81503a',roof:'#38373a',active:true,desc:'Taller del herrero · único interior habilitado'},
{name:'CARPINTERÍA',x:43,y:12,w:12,h:12,color:'#855f3a',roof:'#443a2c',desc:'Fachada decorativa · interior cerrado'},
{name:'ARCANISTA',x:25,y:7,w:13,h:10,color:'#5c456e',roof:'#353048',desc:'Fachada decorativa · interior cerrado'},
{name:'CURTIDURÍA',x:9,y:42,w:13,h:12,color:'#705040',roof:'#454034',desc:'Fachada decorativa · interior cerrado'},
{name:'JOYERÍA',x:43,y:42,w:12,h:12,color:'#75624c',roof:'#40413f',desc:'Fachada decorativa · interior cerrado'},
{name:'MERCADO',x:42,y:27,w:15,h:12,color:'#99764b',market:true,desc:'Puestos comerciales · vista preliminar'},
{name:'PLAZA',x:24,y:24,w:15,h:15,plaza:true,desc:'Plaza central · corazón de la ciudad'}
];
const path=new Set();const mark=(x,y)=>{if(x>=0&&y>=0&&x<N&&y<N)path.add(y*N+x)};
function stripe(x1,y1,x2,y2,width){let steps=Math.max(Math.abs(x2-x1),Math.abs(y2-y1))*3;for(let i=0;i<=steps;i++){let x=x1+(x2-x1)*i/steps,y=y1+(y2-y1)*i/steps;for(let oy=-width;oy<=width;oy++)for(let ox=-width;ox<=width;ox++)if(ox*ox+oy*oy<=(width+.35)**2)mark(Math.round(x)+ox,Math.round(y)+oy)}}
stripe(31,62,31,31,2);stripe(31,31,16,31,2);stripe(16,31,16,27,2);stripe(31,31,48,31,2);stripe(31,31,31,17,2);stripe(31,31,16,48,2);stripe(31,31,48,48,2);stripe(48,31,48,25,2);for(let y=23;y<=39;y++)for(let x=23;x<=39;x++)mark(x,y);
for(const p of places){if(p.plaza||p.market)continue;let cx=Math.floor(p.x+p.w/2),cy=Math.floor(p.y+p.h/2);for(let i=-2;i<=2;i++)for(let j=0;j<=3;j++)mark(cx+i,p.y+p.h+j);}
let seed=17;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const tileSeeds=Array.from({length:N*N},()=>rand());
function resize(){let d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=Math.round(w*d);c.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);scale=zoom*Math.min(w/930,h/710)*1.18;}
function msg(t){notice.textContent=t;lastNotice=performance.now()}
function interact(){let target=null,best=Infinity;for(const p of places){let ax=Math.max(p.x,Math.min(player.x,p.x+p.w)),ay=Math.max(p.y,Math.min(player.y,p.y+p.h));let d=Math.hypot(player.x-ax,player.y-ay);if(d<best){best=d;target=p;}}if(target&&best<5){if(target.active){msg('Herrería: interior habilitado en la versión principal v0.11. Esta vista 63×63 es una prueba separada del mapa; aún no enlaza el interior.')}else msg(target.desc)}else msg('Acercate a un taller, la plaza o el mercado para inspeccionarlo.')}
function occupied(x,y){return x<1||y<1||x>62||y>62||places.some(p=>!p.market&&!p.plaza&&x>p.x+.45&&x<p.x+p.w-.45&&y>p.y+.45&&y<p.y+p.h-.45)}
function drawTile(x,y){const s=tileSeeds[y*N+x],px=x*T,py=y*T; if(path.has(y*N+x)){ctx.fillStyle=s>.5?'#74706a':'#64615a';ctx.fillRect(px,py,T+1,T+1);ctx.strokeStyle='#383933a8';ctx.lineWidth=1.9;for(let j=0;j<3;j++){let shift=j%2?3:-4, yy=py+j*11;for(let i=-1;i<3;i++){let xx=px+i*16+shift;ctx.beginPath();ctx.roundRect(xx+1,yy+1,15,10,2);ctx.stroke();ctx.fillStyle=(s+(i+j)*.17)%1>.55?'#93908838':'#292a2420';ctx.fill()}}}else{ctx.fillStyle=s>.75?'#48583e':s>.4?'#415237':'#3a4d35';ctx.fillRect(px,py,T+1,T+1);if(s>.45){ctx.fillStyle='#78905c55';ctx.fillRect(px+5+s*13,py+11,2,5)}}}
function building(p){let x=p.x*T,y=p.y*T,W=p.w*T,H=p.h*T;if(p.plaza){ctx.strokeStyle='#bca16a';ctx.lineWidth=5;ctx.strokeRect(x+7,y+7,W-14,H-14);ctx.fillStyle='#b3a083';ctx.beginPath();ctx.arc(x+W/2,y+H/2,43,0,Math.PI*2);ctx.fill();ctx.fillStyle='#607c91';ctx.beginPath();ctx.arc(x+W/2,y+H/2,27,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d8d5bd';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#d5c393';ctx.font='bold 22px Georgia';ctx.textAlign='center';ctx.fillText('PLAZA CENTRAL',x+W/2,y+26);return}if(p.market){for(let i=0;i<4;i++){let xx=x+18+(i%2)*175,yy=y+24+Math.floor(i/2)*160;ctx.fillStyle='#4d3527';ctx.fillRect(xx+6,yy+23,122,72);ctx.fillStyle=i%2?'#9e5949':'#b59b6b';ctx.beginPath();ctx.moveTo(xx,yy+24);ctx.lineTo(xx+138,yy+24);ctx.lineTo(xx+119,yy);ctx.lineTo(xx+20,yy);ctx.closePath();ctx.fill();ctx.fillStyle='#c7a96b';ctx.fillRect(xx+16,yy+70,104,10)}ctx.fillStyle='#ffdaa1';ctx.font='bold 24px Georgia';ctx.textAlign='center';ctx.fillText('MERCADO',x+W/2,y-12);return}
ctx.fillStyle='#14131185';ctx.fillRect(x+9,y+13,W,H);ctx.fillStyle=p.color;ctx.fillRect(x+13,y+13,W-26,H-26);ctx.strokeStyle='#bea274';ctx.lineWidth=5;ctx.strokeRect(x+13,y+13,W-26,H-26);ctx.fillStyle=p.roof;ctx.beginPath();ctx.moveTo(x+4,y+H*.36);ctx.lineTo(x+W/2,y-12);ctx.lineTo(x+W-4,y+H*.36);ctx.closePath();ctx.fill();ctx.strokeStyle='#8b7456';ctx.lineWidth=7;ctx.stroke();ctx.fillStyle='#292018';ctx.fillRect(x+W/2-22,y+H-39,44,40);ctx.fillStyle='#b78e50';ctx.fillRect(x+W/2-22,y+H-39,44,3);if(p.active){ctx.fillStyle='#ffba57';ctx.beginPath();ctx.arc(x+W/2-6,y+H-55,13,0,7);ctx.fill();}ctx.fillStyle='#f1ddb3';ctx.textAlign='center';ctx.font='bold 22px Georgia';ctx.fillText(p.name,x+W/2,y+H*.61);ctx.font='15px Georgia';ctx.fillStyle=p.active?'#d9ffc2':'#c0b1a0';ctx.fillText(p.active?'INTERIOR HABILITADO':'FACHADA',x+W/2,y+H*.69)}
function draw(){let centerX=player.x*T,centerY=player.y*T;ctx.setTransform(c.width/w,0,0,c.height/h,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle='#151912';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2+dx,h/2+dy);ctx.scale(scale,scale);ctx.translate(-centerX,-centerY);const margin=5;let minX=Math.max(0,Math.floor((centerX-(w/2+Math.abs(dx))/scale)/T)-margin),maxX=Math.min(62,Math.ceil((centerX+(w/2+Math.abs(dx))/scale)/T)+margin),minY=Math.max(0,Math.floor((centerY-(h/2+Math.abs(dy))/scale)/T)-margin),maxY=Math.min(62,Math.ceil((centerY+(h/2+Math.abs(dy))/scale)/T)+margin);for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++)drawTile(x,y);for(const p of places)building(p);ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(player.x*T+4,player.y*T+12,12,7,0,0,7);ctx.fill();ctx.fillStyle='#2e5e81';ctx.beginPath();ctx.arc(player.x*T,player.y*T,12,0,7);ctx.fill();ctx.strokeStyle='#ffe5a0';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff2c8';ctx.fillRect(player.x*T-3,player.y*T-18,6,14);ctx.restore();ctx.fillStyle='#d3b47c';ctx.font='12px Georgia';ctx.fillText('Vista de distribución · 63 × 63 · no sustituye al mapa principal',14,h-14);}
function tick(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;let vx=(keys.has('right')||keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('left')||keys.has('a')||keys.has('arrowleft')?1:0),vy=(keys.has('down')||keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('up')||keys.has('w')||keys.has('arrowup')?1:0);let length=Math.hypot(vx,vy);if(length){vx/=length;vy/=length;let xx=player.x+vx*dt*7,yy=player.y+vy*dt*7;if(!occupied(xx,player.y))player.x=xx;if(!occupied(player.x,yy))player.y=yy;dx=dy=0;posEl.textContent='Posición: '+Math.floor(player.x)+', '+Math.floor(player.y);}draw();requestAnimationFrame(tick)}
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys.add(k);if('arrowup arrowdown arrowleft arrowright '.includes(k+' '))e.preventDefault();if(k==='e'||k==='enter')interact()});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('#dpad button').forEach(b=>{let dir=b.dataset.dir;for(const e of ['pointerdown'])b.addEventListener(e,v=>{v.preventDefault();keys.add(dir);b.setPointerCapture(v.pointerId)});for(const e of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(e,()=>keys.delete(dir))});document.getElementById('action').addEventListener('click',interact);function setZoom(x){zoom=Math.min(2.8,Math.max(.45,x));resize()}document.getElementById('plus').onclick=()=>setZoom(zoom*1.2);document.getElementById('minus').onclick=()=>setZoom(zoom/1.2);c.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*(e.deltaY>0?.90:1.10))},{passive:false});c.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(pointer){dx+=e.clientX-pointer.x;dy+=e.clientY-pointer.y;pointer={x:e.clientX,y:e.clientY}}});c.addEventListener('pointerup',()=>pointer=null);window.addEventListener('resize',resize);resize();requestAnimationFrame(tick);
})();
</script></body></html>
