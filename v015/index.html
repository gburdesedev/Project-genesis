<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Genesis 0.15 V001 — PlayCanvas</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10181d;color:#eee;font:14px system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}#mobile{display:none;position:fixed;inset:auto 0 12px;pointer-events:none;z-index:50}#mobile button{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;width:58px;height:58px;border-radius:14px;border:1px solid #b7b7a0;background:#14212cdb;color:white;font-size:24px;font-weight:bold}#pad{position:absolute;bottom:0;left:14px;display:grid;grid-template-columns:repeat(3,58px);gap:4px}#pad .up{grid-column:2}#pad .left{grid-column:1;grid-row:2}#pad .down{grid-column:2;grid-row:2}#pad .right{grid-column:3;grid-row:2}@media(pointer:coarse){#mobile{display:block}#controls{bottom:148px;left:10px;right:10px;font-size:11px;pointer-events:none}#ui{max-height:25vh;max-width:70vw;padding:7px}#ui h1{font-size:13px}}#ui{position:absolute;top:12px;left:12px;background:#14212ce8;padding:14px;border:1px solid #5d6d70;border-radius:8px;max-width:390px;max-height:65vh;overflow:auto}#ui h1{font-size:18px;margin:0 0 8px}#rows{font:12px monospace;white-space:pre-wrap}#controls{position:absolute;bottom:12px;left:12px;background:#14212ce8;padding:10px;border-radius:6px}#mobile{right:0}#actions{position:absolute;right:14px;bottom:0;display:grid;grid-template-columns:repeat(2,62px);gap:6px}#actions button{font-size:12px;width:62px;height:54px}#mobile button:active{background:#526a76}#orientation{display:none;position:fixed;right:10px;top:10px;z-index:55;padding:7px;background:#14212cdd;color:white;border:1px solid #8a8a7a;border-radius:6px;font-size:12px}@media(pointer:coarse) and (orientation:portrait){#orientation{display:block}#ui{top:45px;max-height:19vh}#controls{display:none}}@media(pointer:coarse) and (orientation:landscape){#ui{max-height:24vh}#controls{display:none}}@media(pointer:fine){#mobile{display:none}} </style></head><body><canvas id="app"></canvas><section id="ui"><h1>Genesis 0.15 V001</h1><div id="status">Iniciando suelo...</div><pre id="rows"></pre></section><div id="controls">PC: WASD y arrastrar · Celular: flechas y deslizar sobre el mundo para girar cámara</div><div id="mobile"><div id="pad"><button class="up" data-key="KeyW" aria-label="Adelante">▲</button><button class="left" data-key="KeyA" aria-label="Izquierda">◀</button><button class="down" data-key="KeyS" aria-label="Atrás">▼</button><button class="right" data-key="KeyD" aria-label="Derecha">▶</button></div><div id="actions"><button data-key="ShiftLeft" aria-label="Correr">Correr</button><button id="interact" aria-label="Interactuar">Acción</button><button id="zoom-in" aria-label="Acercar cámara">Zoom +</button><button id="zoom-out" aria-label="Alejar cámara">Zoom −</button><button id="full-screen" aria-label="Pantalla completa">⛶</button></div></div><button id="orientation" type="button">⛶ Pantalla horizontal</button><script src="./v015-diagnostics.js"></script><script src="./assets/vendor/playcanvas/playcanvas.min.js"></script><script type="module">
const diag=window.GenesisV015Diagnostics;diag?.block('runtime.playcanvas','starting');const status=document.getElementById('status'),rows=document.getElementById('rows');const pc=window.pc;if(!pc){status.textContent='FALTA MOTOR LOCAL: assets/vendor/playcanvas/playcanvas.min.js';throw Error('PlayCanvas local engine missing')}
const canvas=document.getElementById('app');const app=new pc.Application(canvas,{graphicsDeviceOptions:{alpha:false,antialias:true}});app.start();app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);window.addEventListener('resize',()=>app.resizeCanvas());
app.scene.ambientLight=new pc.Color(.45,.46,.45);app.scene.exposure=1.2;
const floor=new pc.Entity('Piso 63x63');floor.addComponent('render',{type:'box'});floor.setLocalScale(63,.2,63);floor.setPosition(0,-.1,0);const mat=new pc.StandardMaterial();mat.diffuse=new pc.Color(.72,.72,.72);mat.update();
const texBase='./assets/playcanvas/approved/world/floors/plaza/cobblestone/';
const textureFiles=[['diffuseMap','cobble_color.png'],['normalMap','cobble_normal.png'],['aoMap','cobble_ao.png']];
for(const [property,file] of textureFiles){
  const texture=new pc.Asset('Original PBR '+file,'texture',{url:texBase+file});
  app.assets.add(texture);
  texture.once('load',()=>{mat[property]=texture.resource;mat.update();});
  texture.once('error',err=>console.error('PBR texture failed',file,err));
  app.assets.load(texture);
}
floor.render.material=mat;app.root.addChild(floor);
const sun=new pc.Entity('Sol');sun.addComponent('light',{type:'directional',color:new pc.Color(1,.94,.8),intensity:1.3,castShadows:true});sun.setEulerAngles(45,30,0);app.root.addChild(sun);
const camera=new pc.Entity('Camara');camera.addComponent('camera',{clearColor:new pc.Color(.25,.34,.4),farClip:180});app.root.addChild(camera);
diag?.block('manifest','request');const manifest=await (await fetch('./manifest.json',{cache:'no-store'})).json();diag?.block('manifest','ready',{characters:manifest.characters.length});const people=new Map(),states=new Map();
for(const c of manifest.characters){states.set(c.id,{name:c.name,received:0,total:c.bytes||null,status:'Pendiente'})}
const fmt=x=>x==null?'?':(x/1024).toFixed(1);function refresh(){rows.textContent=[...states.values()].map(x=>x.name+': '+fmt(x.received)+'/'+fmt(x.total)+' KiB · '+x.status).join('\n')}
refresh();status.textContent='Suelo 63 × 63 listo · Cargando personajes locales';
for(const c of manifest.characters){const s=states.get(c.id);let controller=new AbortController(),last=Date.now();const watchdog=setInterval(()=>{if(Date.now()-last>120000)controller.abort()},1000);try{const url=new URL(c.file,location.href);if(url.origin!==location.origin)throw Error('Modelo externo bloqueado');s.status='Descargando';diag?.asset(c.id,'request',{url:url.pathname});refresh();const res=await fetch(url,{signal:controller.signal});if(!res.ok)throw Error('HTTP '+res.status);const length=Number(res.headers.get('content-length'));if(length>0)s.total=length;const chunks=[];const reader=res.body.getReader();while(true){const {done,value}=await reader.read();if(done)break;chunks.push(value);s.received+=value.byteLength;last=Date.now();diag?.asset(c.id,'downloading',{loaded:s.received,total:s.total});refresh()}const bytes=new Uint8Array(s.received);let offset=0;for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.byteLength}if(bytes.length<12||String.fromCharCode(...bytes.slice(0,4))!=='glTF'||new DataView(bytes.buffer).getUint32(8,true)!==bytes.length)throw Error('GLB inválido');s.status='Procesando GLB';diag?.asset(c.id,'decoding',{loaded:s.received,total:s.total});refresh();const asset=new pc.Asset(c.name,'container',{url:url.href,filename:c.id+'.glb'},null,{buffer:bytes.buffer});app.assets.add(asset);await new Promise((resolve,reject)=>{asset.once('load',resolve);asset.once('error',reject);app.assets.load(asset)});const entity=asset.resource.instantiateRenderEntity();entity.name=c.name;const pos=c.position||[1.72,0,1.90];if(c.attachTo){const parent=people.get(c.attachTo);if(parent){parent.addChild(entity);entity.setLocalPosition(0,0,0)}else app.root.addChild(entity)}else{entity.setPosition(...pos);app.root.addChild(entity);people.set(c.id,entity)}s.status='Listo';diag?.asset(c.id,'instantiated',{loaded:s.received,total:s.total});refresh()}catch(e){s.status='ERROR '+String(e.message||e);diag?.asset(c.id,'error',{message:String(e.message||e),stack:String(e.stack||'')});refresh()}finally{clearInterval(watchdog)}}
const artisan=people.get('artisan');const keys=new Set();window.addEventListener('keydown',e=>keys.add(e.code));window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());for(const btn of document.querySelectorAll('#pad button')){const code=btn.dataset.key;btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);keys.add(code)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(ev,e=>{e.preventDefault();keys.delete(code)})}let yaw=0,drag=false,px=0,zoom=8;const requestLandscape=async()=>{try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){console.info('Fullscreen unavailable',e)}try{if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch(e){console.info('Landscape lock unavailable on this browser',e)}};document.getElementById('orientation').addEventListener('click',requestLandscape);document.getElementById('full-screen').addEventListener('click',requestLandscape);document.getElementById('interact').addEventListener('click',()=>{diag?.block('input.interact','pressed');status.textContent='Acción recibida · Interacciones del juego pendientes de integración'});for(const [id,delta] of [['zoom-in',-1],['zoom-out',1]])document.getElementById(id).addEventListener('click',()=>{zoom=Math.max(3,Math.min(16,zoom+delta))});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(3,Math.min(16,zoom+Math.sign(e.deltaY)))},{passive:false});canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;canvas.setPointerCapture(e.pointerId)});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-px)*.006;px=e.clientX}});
app.on('update',dt=>{if(artisan){const p=artisan.getPosition().clone(),speed=(keys.has("ShiftLeft")?5.4:3)*dt;let dx=0,dz=0;if(keys.has('KeyW'))dz-=1;if(keys.has('KeyS'))dz+=1;if(keys.has('KeyA'))dx-=1;if(keys.has('KeyD'))dx+=1;const x=dx*Math.cos(yaw)-dz*Math.sin(yaw),z=dx*Math.sin(yaw)+dz*Math.cos(yaw);p.x=Math.max(-31,Math.min(31,p.x+x*speed));p.z=Math.max(-31,Math.min(31,p.z+z*speed));p.y=0;artisan.setPosition(p);camera.setPosition(p.x+Math.sin(yaw)*zoom,p.y+zoom*.75,p.z+Math.cos(yaw)*zoom);camera.lookAt(p.x,p.y+1,p.z)}else{camera.setPosition(8,7,12);camera.lookAt(0,0,0)}});
diag?.block('characters','completed');status.textContent='Carga terminada · Revisar estados de cada personaje';
</script></body></html>
