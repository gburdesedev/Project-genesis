<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Genesis · Ciudad 63x63</title><style>*{box-sizing:border-box}body{margin:0;background:#14201b;color:#f1e2bc;font:14px system-ui}canvas{width:100vw;height:100vh;display:block;touch-action:none}header{position:fixed;top:10px;left:10px;background:#171d19e8;border:1px solid #c7a36a;padding:12px;border-radius:10px;max-width:76vw}h2{font:22px Georgia;margin:0 0 6px;color:#f2ca87}small{color:#e0d0ad}#panel{position:fixed;bottom:14px;left:12px;right:12px;max-width:440px;background:#171c18f5;border:1px solid #c7a36a;padding:12px;border-radius:10px;display:none}button,a{border:1px solid #c7a36a;border-radius:5px;background:#59432b;color:#ffebc4;padding:9px;text-decoration:none}#zoom{position:fixed;right:12px;top:12px;display:grid;gap:6px}</style><canvas id="map"></canvas><header><h2>PROJECT GENESIS · CIUDAD 63×63</h2><small>Vista experimental de distribución · 5 talleres, plaza, mercado y red de caminos. Solo Herrería jugable. Arrastrá el mapa, acercá y tocá un edificio.</small></header><div id="zoom"><button onclick="z=Math.min(3,z*1.2);render()">＋</button><button onclick="z=Math.max(.55,z/1.2);render()">－</button></div><div id="panel"><button style="float:right" onclick="this.parentElement.style.display='none'">×</button><h2 id="title"></h2><p id="desc"></p><div id="action"></div></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,z=1,ox=0,oy=0,down=null,travel=0;
const sites=[['Herrería',13,20,5,'⚒',1],['Carpintería',48,18,5,'🪚',0],['Arcanista',31,12,5,'✧',0],['Curtiduría',15,48,5,'◈',0],['Joyería',48,48,5,'◆',0],['Mercado',48,32,6,'⚖',0]];
const cobble=new Set(),add=(x,y,r=2)=>{for(let a=-r;a<=r;a++)for(let b=-r;b<=r;b++)if(a*a+b*b<=r*r&&x+a>=0&&y+b>=0&&x+a<63&&y+b<63)cobble.add((x+a)+','+(y+b))};
function path(x,y,X,Y,r=2){let n=Math.ceil(Math.hypot(X-x,Y-y)*3);for(let i=0;i<=n;i++)add(Math.round(x+(X-x)*i/n),Math.round(y+(Y-y)*i/n),r)}
for(let x=23;x<=39;x++)for(let y=24;y<=40;y++)add(x,y,0);
for(const t of sites)path(31,32,t[1],t[2],t[0]==='Mercado'?3:2);path(31,32,31,62,3);
const rnd=(x,y)=>{let a=Math.sin(x*78.24+y*134.93)*43624.6;return a-Math.floor(a)};
function render(){W=innerWidth;H=innerHeight;let d=devicePixelRatio||1;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);let u=Math.min(W,H)*.82/63*z,p=(x,y)=>[(x-31.5)*u+W/2+ox,(y-31.5)*u+H/2+oy];g.fillStyle='#111b17';g.fillRect(0,0,W,H);
for(let x=0;x<63;x++)for(let y=0;y<63;y++){const [a,b]=p(x,y),stone=cobble.has(x+','+y),r=rnd(x,y);g.fillStyle=stone?(r>.48?'#8a806d':'#776e60'):(r>.6?'#47583e':'#3d4b37');g.fillRect(a,b,u+1,u+1);if(stone&&u>2){g.strokeStyle='#b1a28a';g.lineWidth=.65;g.strokeRect(a+u*.1,b+u*.12,u*.81,u*.75)}}
for(const t of sites){let [name,x,y,r,icon,active]=t,[a,b]=p(x-r,y-r);g.fillStyle='#554939';g.fillRect(a-u*.2,b-u*.2,r*2*u+u*.4,r*2*u+u*.4);if(name==='Mercado'){for(let k=0;k<4;k++){g.fillStyle=k%2?'#b68b55':'#975947';g.fillRect(a+u*(1+k*2.6),b+u*2,u*2,u*3)}}else{g.fillStyle=active?'#b3734a':'#75604b';g.fillRect(a,b,r*2*u,r*2*u);g.beginPath();g.moveTo(a-u,b+r*u*.8);g.lineTo(a+r*u,b-u*1.6);g.lineTo(a+2*r*u+u,b+r*u*.8);g.closePath();g.fillStyle=active?'#8b4837':'#56483b';g.fill();g.strokeStyle='#d3a970';g.stroke()}
g.textAlign='center';g.font='bold '+Math.max(11,Math.min(17,u*1.5))+'px Georgia';g.shadowColor='#000';g.shadowBlur=5;g.fillStyle='#ffe9b9';g.fillText(icon+' '+name,a+r*u,b+r*2*u+u*2);g.shadowBlur=0}
let [a,b]=p(31,32);g.beginPath();g.arc(a,b,u*3,0,7);g.lineWidth=Math.max(1,u*.25);g.strokeStyle='#d7b783';g.stroke();g.fillStyle='#f0dcaf';g.font='bold '+Math.max(12,u*1.7)+'px Georgia';g.textAlign='center';g.fillText('PLAZA CENTRAL',a,b-u*4)}
function select(px,py){let u=Math.min(W,H)*.82/63*z,x=(px-W/2-ox)/u+31.5,y=(py-H/2-oy)/u+31.5,t=sites.find(q=>Math.abs(x-q[1])<=q[3]+2&&Math.abs(y-q[2])<=q[3]+2);if(!t)return;document.querySelector('#title').textContent=t[4]+' '+t[0];document.querySelector('#desc').textContent=t[5]?'Único taller con acceso a la experiencia jugable.':'Exterior decorativo; interior todavía no habilitado.';document.querySelector('#action').innerHTML=t[5]?'<a href="./index.html">Entrar a la herrería jugable ↗</a>':'<small>Sin acceso interior</small>';document.querySelector('#panel').style.display='block'}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);down=[e.clientX,e.clientY];travel=0});c.addEventListener('pointermove',e=>{if(!down)return;ox+=e.clientX-down[0];oy+=e.clientY-down[1];travel+=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=[e.clientX,e.clientY];render()});c.addEventListener('pointerup',e=>{if(travel<8)select(e.clientX,e.clientY);down=null});c.addEventListener('wheel',e=>{e.preventDefault();z=Math.max(.55,Math.min(3,z*(e.deltaY>0?.91:1.1)));render()},{passive:false});addEventListener('resize',render);render();
</script></html>
