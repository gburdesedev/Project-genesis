<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Genesis · Fabricación · estudio de interfaz v0.1.011</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;min-height:100%;background:#0d100f;color:#f0e2bd;font-family:Georgia,"Times New Roman",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #f7ca6c;outline-offset:3px}
header{height:62px;padding:10px 22px;display:flex;align-items:center;justify-content:space-between;background:#111715;border-bottom:1px solid #5b482a}
header b{letter-spacing:2px;font-size:16px}
header small{font:12px system-ui;color:#b9a477}
#viewport{height:calc(100dvh - 62px);display:grid;place-items:center;overflow:hidden}
#wrapper{position:relative}
#board{position:absolute;width:1536px;height:1024px;overflow:hidden;transform-origin:top left;background:#0c0e0d url('../assets/ui/preparacion/01_Capas/Fondo/FondoEstructural.png') center/100% 100% no-repeat}
nav{position:absolute;inset:0;pointer-events:none;z-index:5}
.tab{position:absolute;top:42px;height:94px;border:0;padding:0;background:transparent;pointer-events:auto}
.tab img.tabBase{width:100%;height:100%;display:block;filter:brightness(.50) saturate(.52);transition:filter .15s}
.tab img.tabGlow{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .15s}
.tab[aria-selected=true] img.tabBase{filter:brightness(1.35) saturate(1.15) drop-shadow(0 0 7px #c89443)}
.tab[aria-selected=true] img.tabGlow{opacity:1;filter:brightness(1.05)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:22%;right:22%;bottom:14px;height:2px;background:#f6cf78;box-shadow:0 0 9px #ffd26e,0 0 15px #dc9437;pointer-events:none}
.tab:hover:not([aria-selected=true]) img.tabBase{filter:brightness(.78) saturate(.85)}
#content{position:absolute;inset:0;z-index:2}
.bronze{border:2px solid #80663c;outline:1px solid #24170b;box-shadow:inset 0 0 0 2px #271c0e,inset 0 0 35px #0009,0 0 12px #0009;background:linear-gradient(150deg,#161b19f5,#0d1110f7)}
.panel{position:absolute;top:164px;height:755px;overflow:hidden}
.panel h2{font-size:25px;letter-spacing:1.2px;font-weight:400;color:#e8cd87;margin:0}
.panelHead{height:55px;padding:15px 16px 8px;border-bottom:1px solid #61492c}
.categoryPanel{left:37px;width:195px}
.category{display:flex;align-items:center;text-align:left;width:calc(100% - 15px);min-height:77px;margin:9px 7px 0;padding:7px 10px;border:1px solid #564a34;background:linear-gradient(130deg,#1b201f,#111514);gap:12px;transition:background .15s,border-color .15s}
.category:hover,.category.active{border-color:#e5ba5c;background:linear-gradient(130deg,#554026,#1d211c);box-shadow:inset 0 0 12px #ce853d3a}
.category .symbol{font:30px Georgia;width:35px;text-align:center;color:#e9d29d;flex-shrink:0}
.category .name{font-size:18px;line-height:1.12}
.gridPanel{left:244px;width:329px}
.gridWrap{padding:10px 12px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(6,99px);gap:8px}
.slot{position:relative;border:1px solid #7c6341;background:rgba(0,0,0,.68);padding:6px;overflow:hidden;display:grid;place-items:center}
.slot:hover,.slot.active{border-color:#f0bc5d;box-shadow:inset 0 0 0 1px #e6a95a66,0 0 10px #d99b4040}
.slot img{width:100%;height:100%;object-fit:contain}
.slot[data-model]{-webkit-touch-callout:none;user-select:none;touch-action:manipulation}
.slot .qty{position:absolute;bottom:4px;right:5px;z-index:3;font:16px system-ui;text-shadow:1px 1px 4px #000,0 0 3px #000}
.slot model-viewer.slotModel{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);z-index:2;opacity:0;pointer-events:none;background:transparent;transition:opacity .22s}
.slot.is3dReady model-viewer.slotModel{opacity:1}
.slot.is3dReady > img{opacity:0}
.slot.is3dLoading::after{content:"CARGANDO 3D";position:absolute;bottom:23px;left:3px;right:3px;z-index:3;text-align:center;font:9px system-ui;color:#e1bd83;text-shadow:0 2px 3px #000;pointer-events:none}
.slot.is3dLoading > img{opacity:.5}
@media(hover:none){.slot.is3dLoading::after{display:none}}
.swordMini{display:grid;place-items:center;filter:drop-shadow(0 2px 5px #000)}
.slot .swordMini{width:74px;height:80px}
.thumb .swordMini{width:57px;height:67px}
.swordMini svg{display:block;width:100%;height:100%;overflow:hidden}
.empty{opacity:.76;cursor:default}
.paging{height:42px;display:flex;align-items:center;justify-content:center;gap:20px;font:13px system-ui;color:#bca77f}
.paging button{width:33px;height:29px;background:#1d201b;border:1px solid #725933}
.paging button:disabled{opacity:.3;cursor:default}
.viewerPanel{left:586px;width:558px}
.viewerPanel .backdrop,.detailViewer .backdrop{position:absolute;inset:0;background:url('../assets/ui/preparacion/01_Capas/Paneles/FondoVisorHerreria.png') center/cover no-repeat;opacity:.72;filter:brightness(.78)}
.viewerPanel:after,.detailViewer:after{content:'';position:absolute;inset:0;border:11px solid transparent;pointer-events:none;box-shadow:inset 0 0 48px #050705}
.viewerTitle{position:absolute;z-index:2;top:17px;left:12px;right:12px;text-align:center;text-shadow:0 2px 6px #000}
.viewerTitle h1{font-size:29px;font-weight:400;letter-spacing:1.1px;margin:0}
.viewerTitle .subtitle{font-size:17px;color:#ded5c5;margin-top:4px}
.previewArt{position:absolute;top:103px;bottom:78px;left:20px;right:20px;display:grid;place-items:center;z-index:2}
.previewArt img{width:90%;height:78%;object-fit:contain;filter:drop-shadow(0 14px 14px #000c)}
.previewArt img.ore{transform:scale(1.16)}
.viewerFoot{position:absolute;bottom:16px;left:10px;right:10px;text-align:center;z-index:3;font:16px system-ui;color:#ead7a7;text-shadow:0 2px 4px #000}
.swordBox{width:100%;height:100%;display:grid;place-items:center;touch-action:none;cursor:grab;perspective:950px}
.swordBox:active{cursor:grabbing}
.swordRotator{width:200px;height:565px;transform-style:preserve-3d;will-change:transform;filter:drop-shadow(0 14px 17px #000)}
.swordRotator svg{width:100%;height:100%;overflow:visible}
.placeholderBadge{display:inline-block;font:11px system-ui;letter-spacing:1px;border:1px solid #6c5733;background:#141717e8;color:#d1b276;padding:5px 8px;margin-top:5px}
.rightPanel{left:1156px;width:342px}
.rightPanel .body{padding:18px 18px 16px}
.ey{font:13px system-ui;letter-spacing:1.3px;color:#d5b775;text-transform:uppercase}
.rightPanel .itemLine{display:flex;gap:13px;align-items:center;margin:13px 0 17px}
.thumb{width:81px;height:80px;flex:0 0 81px;background:#17211c;border:1px solid #856841;display:grid;place-items:center;overflow:hidden}
.thumb img{max-width:97%;max-height:97%;object-fit:contain}
.thumb .symbol{font-size:50px;color:#dcc58e}
.itemLine h3{font-size:21px;font-weight:400;margin:0 0 6px}
.mini{font:13px/1.5 system-ui;color:#c4b695}
.rarity{display:inline-block;border:1px solid #c69a4e;color:#f0cc6c;padding:4px 12px;margin-top:6px;font:15px Georgia;letter-spacing:1px}
.stat{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #574a33;padding:14px 0;font:14px/1.35 system-ui}
.stat b{font-weight:500;color:#efcf8f;text-align:right}
.desc{font:14px/1.55 system-ui;color:#d3c4a8;margin:16px 0}
.action{display:block;width:100%;border:1px solid #d5a34e;color:#f6da9a;padding:16px 10px;background:linear-gradient(#614b2c,#33271c);font-size:17px;letter-spacing:1px;margin-top:18px}
.action:hover{filter:brightness(1.18)}
.action:disabled{opacity:.5;cursor:default}
.sheetViewer{left:36px;width:734px}
.sheetData{left:785px;width:713px}
.sheetTitle{text-align:center;padding-top:18px}
.sheetTitle .kicker{font-size:30px;letter-spacing:1px}
.sheetTitle .object{font-size:24px;margin-top:5px}
.sheetTabs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:19px 12px 0}
.sheetTabs button{height:54px;background:#171d1b;border:1px solid #79603d;font-size:19px}
.sheetTabs button.active{background:linear-gradient(#6f532d,#322c1d);border-color:#f0bb56;color:#ffe0a0}
.sheetBody{padding:13px 22px}
.sectionLabel{font-size:19px;color:#efca78;border-bottom:1px solid #6e5533;padding:6px 0;margin:3px 0 5px;letter-spacing:1px}
.sheetRow{height:35px;display:grid;grid-template-columns:46% 54%;align-items:center;border-bottom:1px solid #403e30;font:15px system-ui}
.sheetRow span:last-child{color:#e7d1a5}
.sheetNGE{margin-top:8px}
.ngeScroll{height:122px;overflow-y:auto;padding:12px 14px;border:1px solid #7a5b36;background:#0d1211d9;scrollbar-color:#b08b49 #20241d;scrollbar-width:thin;font:italic 16px/1.58 Georgia}
.ngeScroll p{margin:0 0 12px}
.sheetReturn{position:absolute;right:20px;top:16px;bottom:auto;width:177px;margin:0;padding:9px 8px;font-size:12px;z-index:4}
.sheetViewer .viewerTitle{top:25px}
.sheetViewer .previewArt{top:82px;bottom:85px}
.note{position:absolute;bottom:40px;left:55px;right:55px;display:flex;justify-content:space-between;font:12px system-ui;color:#b6a17d}
.messagePanel{left:62px;width:1411px;text-align:center;padding:95px 130px}
.messagePanel h1{font-size:36px;font-weight:400}
.messagePanel p{font-size:21px;line-height:1.65;color:#d3c5a6}
.messagePanel .action{max-width:500px;margin:45px auto}
@media(prefers-reduced-motion:reduce){.category{transition:none}}

/* Fabricación — estudio independiente, misma familia visual que Preparación e Inventario */
.fabLayout{position:absolute;left:37px;right:37px;top:164px;height:755px;display:grid;grid-template-columns:330px minmax(0,1fr) 400px;gap:12px}
.fabPane{position:relative;min-width:0;min-height:0;overflow:hidden}
.fabPane:before,.fabPane:after{content:"◆";position:absolute;top:3px;left:6px;font-size:10px;color:#bc9156;z-index:3}
.fabPane:after{left:auto;right:6px}
.fabHead{height:82px;padding:14px 17px 11px;border-bottom:1px solid #6e512f;background:linear-gradient(120deg,#20180f,#101512d6)}
.fabHead small{display:block;font:11px system-ui;letter-spacing:1.7px;color:#aa936b;margin-bottom:5px}
.fabHead h2{margin:0;font:26px Georgia;color:#f1d29b;letter-spacing:1.4px}
.fabHead .micro{font:12px system-ui;color:#9f987f;margin-top:5px}
.fabBodyScroll{height:calc(100% - 82px);overflow-y:auto;padding:14px;overscroll-behavior:contain;scrollbar-color:#b18b4d #1b201b;scrollbar-width:thin}
.fabEyebrow{display:flex;align-items:center;justify-content:space-between;font:11px system-ui;letter-spacing:1.3px;color:#c7a36f;margin:4px 1px 10px}
.fabFamily{display:flex;justify-content:space-between;align-items:center;width:100%;height:65px;padding:10px 13px;border:1px solid #53462f;background:linear-gradient(105deg,#161b19,#0b0e0d);text-align:left;color:#d6c7aa;margin:0 0 7px}
.fabFamily:hover,.fabFamily.active{border-color:#ebbc66;background:linear-gradient(100deg,#4b3420,#181d19);box-shadow:inset 0 0 18px #d8903830}
.fabFamily .famIcon{font-size:28px;width:38px;color:#f1d093;text-align:center}
.fabFamily .famName{font-size:18px;flex:1}
.fabFamily .famState{font:10px system-ui;color:#b9a079}
.fabDivider{border-top:1px solid #715637;margin:16px 0 13px}
.fabRecipe{width:100%;display:grid;grid-template-columns:52px 1fr 17px;gap:11px;align-items:center;padding:10px;border:1px solid #d0a25d;background:linear-gradient(140deg,#3c2c1b,#111614);text-align:left;min-height:90px}
.fabRecipe .rIcon{display:grid;place-items:center;background:#060807bb;border:1px solid #ad844c;width:52px;height:57px;color:#f7d38b;font:33px Georgia}
.fabRecipe b{display:block;font-size:17px;font-weight:400;color:#f0ddae}
.fabRecipe em{display:block;font:11px/1.5 system-ui;color:#bfa989;font-style:normal;margin-top:5px}
.fabInfo{padding:12px 13px;border:1px solid #4d4938;background:#101612c8;color:#c6b89d;font:12px/1.55 system-ui;margin-top:15px}
.fabInfo b{color:#e7be79;font-weight:600}
.fabProgressHead{position:absolute;inset:0 0 auto;z-index:3}
.fabCenterBar{height:82px;padding:14px 20px;border-bottom:1px solid #795c37;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,#1b1c16e8,#201608dc)}
.fabCenterBar h2{margin:2px 0 0;font-size:27px;font-weight:400;color:#f7d89d;letter-spacing:1.1px}
.fabCenterBar small{font:11px system-ui;letter-spacing:1.5px;color:#b4a080}
.fabSeal{border:1px solid #927048;border-radius:50%;width:53px;height:53px;display:grid;place-items:center;font-size:31px;color:#f0cf8a;box-shadow:inset 0 0 15px #cb89302d}
.fabStages{height:58px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;padding:0 12px;background:#080d0bdf;border-bottom:1px solid #76532a}
.fabStageBtn{height:58px;background:transparent;border:0;border-bottom:3px solid transparent;color:#ac9c83;font:15px Georgia;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.fabStageBtn span{width:26px;height:26px;display:grid;place-items:center;border:1px solid #6e5632;font:13px system-ui}
.fabStageBtn.active{border-color:#f0b759;background:linear-gradient(#77502855,#271d14);color:#ffe1a4}
.fabStageBtn.active span{background:#d49f50;color:#24170d}
.fabStageBtn:hover{color:#f2d39d}
.fabTheater{position:relative;height:478px;background:url('../assets/ui/preparacion/01_Capas/Paneles/FondoVisorHerreria.png') center/cover no-repeat}
.fabTheater:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#090c0ad6 0,#05060440 40%,#070b08a9 100%);pointer-events:none}
.fabTheater:after{content:"";position:absolute;inset:10px;box-shadow:inset 0 0 45px #030503,0 0 0 1px #dcb26a33;pointer-events:none}
.fabInscription{position:absolute;top:16px;left:20px;right:20px;z-index:2;display:flex;justify-content:space-between;align-items:center;color:#bdb296;font:11px system-ui;letter-spacing:1.4px;text-shadow:0 2px 4px #000}
.fabInscription strong{font-weight:400;color:#f0cd80}
.fabWeaponFrame{position:absolute;top:48px;left:19px;right:19px;bottom:83px;display:grid;place-items:center;z-index:2;overflow:hidden}
.fabWeaponFrame:before{content:"";position:absolute;width:340px;height:340px;border:1px solid #b9964740;border-radius:50%;background:radial-gradient(circle,#9864261d,transparent 64%);box-shadow:0 0 0 30px #b7861708,0 0 0 62px #e4c77b07}
.fabWeaponFrame:after{content:"";position:absolute;width:210px;height:1px;background:#d6b47450;top:52%;left:50%;transform:translateX(-50%) rotate(-45deg);z-index:0}
.fabWeaponFrame .fabSword{position:relative;width:145px;height:340px;filter:drop-shadow(0 16px 15px #000);transition:filter .3s}
.fabWeaponFrame .fabSword .swordRotator{width:110px;height:341px;margin:0 auto}.fabWeaponFrame .fabSword svg{width:100%;height:100%;overflow:visible}
.fabWeaponFrame.blueprint .affinityFX{display:none}
.fabWeaponFrame.blueprint .fabSword{filter:sepia(.31) saturate(.78) drop-shadow(0 15px 10px #000)}
.fabWeaponFrame.fxDemo .fabSword{animation:fabSlowYaw 14s ease-in-out infinite;transform-style:preserve-3d}
.fabWeaponFrame.fxDemo{perspective:900px}
.fabWeaponFrame.fxDemo .fabSword{filter:drop-shadow(0 0 10px #54b7de66) drop-shadow(0 0 13px #ff8b2866)}
@keyframes fabSlowYaw{0%,100%{transform:rotateY(-25deg)}50%{transform:rotateY(25deg)}}
.fabItemLegend{position:absolute;bottom:13px;left:28px;right:28px;z-index:2;text-align:center}
.fabItemLegend strong{font-weight:400;font-size:19px;color:#f5d89d}
.fabItemLegend small{display:block;font:12px/1.6 system-ui;color:#baae91;margin-top:5px}
.fabChips{display:flex;justify-content:center;gap:8px;margin-top:7px}
.fabChip{border:1px solid #715633;background:#0b1413e3;padding:5px 12px;font:12px system-ui;color:#aacee5}
.fabChip.fire{color:#ffbe84;border-color:#a05c2c}
.fabFootAction{position:absolute;bottom:0;height:137px;left:0;right:0;background:linear-gradient(#0a0f0e,#121410);border-top:1px solid #715635;padding:13px 21px}
.fabFootAction p{font:12px/1.5 system-ui;color:#c4b99e;margin:0;min-height:35px}
.fabFootButtons{display:flex;gap:10px;align-items:center;margin-top:9px}
.fabButton{flex:1;border:1px solid #b2894e;background:linear-gradient(#493623,#231c15);padding:12px;font:15px Georgia;color:#e8d2a6;text-align:center}
.fabButton.primary{background:linear-gradient(#94682c,#4b331e);border-color:#e9b25e;color:#fff0c5;box-shadow:inset 0 0 15px #ffc0682a}
.fabButton.primary:hover:not(:disabled){filter:brightness(1.15)}
.fabButton:disabled{filter:saturate(.45);opacity:.48;cursor:not-allowed}
.fabRight .fabBodyScroll{padding:11px 15px}
.fabBox{border:1px solid #5b4b30;background:#080d0bcf;padding:12px 13px;margin:0 0 11px}
.fabBoxHead{font:15px Georgia;color:#e4c389;border-bottom:1px solid #684d2f;padding-bottom:8px;margin-bottom:10px;letter-spacing:.6px}
.fabMaterialCard{display:grid;grid-template-columns:75px 1fr;gap:11px;align-items:center}
.fabMaterialArt{width:75px;height:77px;background:rgba(0,0,0,.72);border:1px solid #7a5b32;display:grid;place-items:center;overflow:hidden}
.fabMaterialArt img{width:95%;height:95%;object-fit:contain}
.fabMaterialCard strong{display:block;font:16px Georgia;color:#eed4a3}
.fabMaterialCard small{display:block;color:#bcae94;font:12px/1.5 system-ui;margin-top:4px}
.fabStock{margin-top:9px;font:11px/1.4 system-ui;color:#bdb197}
.fabMeter{height:6px;background:#25201a;border:1px solid #60472a;margin-top:7px;overflow:hidden}
.fabMeter i{display:block;height:100%;background:linear-gradient(90deg,#8e672b,#e2b76d);transition:width .22s}
.fabStepper{display:flex;align-items:center;justify-content:space-between;padding-top:10px;gap:6px}
.fabStepper label{font:12px/1.4 system-ui;color:#dac6a0}
.fabStepper .fabStepBtns{display:flex;align-items:center;border:1px solid #836237}
.fabStepBtns button{width:36px;height:36px;background:#302516;border:0;color:#f4d69d;font:22px Georgia}
.fabStepBtns strong{min-width:36px;text-align:center;font-size:17px;font-weight:400}
.fabTechniqueInfo{font:12px/1.6 system-ui;color:#bfb49b}
.fabTechniqueInfo b{color:#f1cc87}
.fabTechWell{display:grid;grid-template-columns:45px 1fr;gap:10px;align-items:center;margin-top:8px}
.fabTechWell span{display:grid;place-items:center;width:45px;height:45px;border:1px dashed #786045;background:#040807aa;font-size:25px;color:#b0a183}
.fabTechWell div{font:12px/1.6 system-ui;color:#b7ac93}
.fabNgeText{height:119px;overflow:auto;background:#070a09e8;border:1px solid #6d5434;padding:10px 11px;font:italic 14px/1.55 Georgia;color:#d6c3a1;scrollbar-color:#be9252 #10140f;scrollbar-width:thin;overscroll-behavior:contain}
.fabNgeText p{margin:0 0 10px}
.fabNotice{margin:0 0 11px;color:#a99578;font:11px/1.5 system-ui}
.fabUnavailable{font:14px/1.65 Georgia;color:#cfbc9b;padding:24px 14px;text-align:center;border:1px dashed #6a5135;background:#0a100f}
.fabDemoSwitch{background:#1f2724;border:1px solid #ab7e43;color:#f0d39e;padding:8px 12px;font:12px system-ui;min-height:40px}
.fabDemoSwitch.on{background:#694323;border-color:#e6ab52}
.fabRight strong.fabLocked{color:#bca681}
.affinityFX .fireEnergy{stroke:#ff9a35;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 5px #ff8024);animation:firePulse 2.4s ease-in-out infinite alternate}
.affinityFX .iceEnergy{stroke:#9cddff;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 5px #63d5f6);animation:icePulse 3.3s ease-in-out infinite alternate}
.affinityFX .flameSpark{fill:#ffbe6d;filter:drop-shadow(0 0 7px #ff7a00);animation:firePulse 1.4s ease-in-out infinite alternate}
.affinityFX .iceSpark{fill:#dbfaff;filter:drop-shadow(0 0 7px #35bffa);animation:icePulse 2.2s ease-in-out infinite alternate}
@keyframes firePulse{from{opacity:.39}to{opacity:.96}}
@keyframes icePulse{from{opacity:.47}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.fabWeaponFrame.fxDemo .fabSword,.affinityFX *{animation:none!important}}


/* Teléfonos: menú de Fabricación legible, con pestañas desplazables y controles táctiles */
@media(max-width:860px){
body.fabResponsive{overflow-y:auto}
body.fabResponsive header{height:auto;min-height:62px;padding:8px 12px;gap:5px;flex-wrap:wrap}
body.fabResponsive header small{font-size:10px}
body.fabResponsive #viewport{display:block;height:auto;min-height:calc(100dvh - 62px);overflow:visible}

function switchMenu(next){if(!tabs.some(function(t){return t.id===next}))return;mainTab=next;view="inventory";render()}
function wireModelHover(){
  if(reduced)return;
  var webglReady=false;
  try{var probe=document.createElement("canvas");webglReady=!!(probe.getContext("webgl2")||probe.getContext("webgl"))}catch(e){webglReady=false}
  document.querySelectorAll(".slot[data-model]").forEach(function(slot){
    if(!webglReady){slot.title="WebGL no disponible: se conserva el PNG aprobado";return}
    var heldPointer=null,pressTimer=0,holdActivated=false;
    function enter(){
      if(slot._hovering)return;
      if(activeModelSlot && activeModelSlot!==slot)leaveOther();
      slot._hovering=true;
      slot._hoverStart=performance.now();
      activeModelSlot=slot;
      clearTimeout(slot._returnTimer);
      if(!slot._mv){
        slot.classList.add("is3dLoading");
        var mv=document.createElement("model-viewer");
        mv.className="slotModel";
        mv.setAttribute("alt","Modelo 3D del material");
        mv.setAttribute("src",slot.dataset.model);
        mv.setAttribute("camera-orbit","0deg 75deg 110%");
        mv.setAttribute("field-of-view","30deg");
        mv.setAttribute("environment-image","neutral");
        mv.setAttribute("shadow-intensity","0.6");
        mv.setAttribute("interaction-prompt","none");
        mv.setAttribute("loading","eager");
        mv.addEventListener("load",function(){
          slot._modelReady=true;slot.classList.remove("is3dLoading");
          if(slot._hovering)slot.classList.add("is3dReady")
        });
        mv.addEventListener("error",function(){
          slot._modelReady=false;slot._hovering=false;
          slot.classList.remove("is3dLoading","is3dReady");
          slot.title="No se pudo abrir el modelo 3D; se conserva el PNG"
        });
        slot._mv=mv;slot.appendChild(mv)
      }else if(slot._modelReady){slot.classList.add("is3dReady")}
    }
    function leaveOther(){
      var old=activeModelSlot;
      if(!old||old===slot)return;
      old._hovering=false;
      if(old._mv)old._mv.setAttribute("camera-orbit","0deg 75deg 110%");
      clearTimeout(old._returnTimer);
      old._returnTimer=setTimeout(function(){if(!old._hovering)old.classList.remove("is3dReady","is3dLoading")},750);
      activeModelSlot=null
    }
    function leave(){
      clearTimeout(pressTimer);
      if(!slot._hovering)return;
      slot._hovering=false;
      if(activeModelSlot===slot)activeModelSlot=null;
      if(slot._mv)slot._mv.setAttribute("camera-orbit","0deg 75deg 110%");
      clearTimeout(slot._returnTimer);
      slot._returnTimer=setTimeout(function(){
        if(!slot._hovering)slot.classList.remove("is3dReady","is3dLoading")
      },750)
    }
    slot.addEventListener("pointerenter",function(e){
      if(e.pointerType==="mouse" && matchMedia("(hover:hover) and (pointer:fine)").matches)enter()
    });
    slot.addEventListener("pointerleave",function(e){
      if(e.pointerType==="mouse" || heldPointer===e.pointerId)leave()
    });
    slot.addEventListener("pointerdown",function(e){
      if(e.pointerType!=="touch" && e.pointerType!=="pen")return;
      heldPointer=e.pointerId;
      holdActivated=false;
      clearTimeout(pressTimer);
      pressTimer=setTimeout(function(){
        if(heldPointer!==e.pointerId)return;
        holdActivated=true;
        enter();
        try{slot.setPointerCapture(e.pointerId)}catch(_){}
      },180)
    });
    function release(e){
      if(heldPointer!==e.pointerId)return;
      clearTimeout(pressTimer);
      heldPointer=null;
      if(holdActivated){
        slot._suppressClick=true;
        setTimeout(function(){slot._suppressClick=false},700);
        holdActivated=false;
        leave()
      }
    }
    slot.addEventListener("pointerup",release);
    slot.addEventListener("pointercancel",release);
    slot.addEventListener("lostpointercapture",release);
    slot.addEventListener("click",function(e){
      if(slot._suppressClick){
        slot._suppressClick=false;
        e.preventDefault();
        e.stopImmediatePropagation()
      }
    },true);
    slot.addEventListener("contextmenu",function(e){
      if(slot._hovering || heldPointer!==null)e.preventDefault()
    })
  })
}
